<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>명함 CRM</title>
<link rel="stylesheet" href="shared.css">
<style>
.home-banner{background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 60%,#3b82f6 100%);padding:24px 20px 28px;color:#fff;}
.home-logo{font-size:13px;font-weight:700;opacity:.8;letter-spacing:.5px;margin-bottom:6px;}
.home-title{font-size:26px;font-weight:800;margin-bottom:4px;}
.home-date{font-size:13px;opacity:.75;}
.stat-row{display:flex;gap:10px;margin-top:18px;}
.stat-chip{flex:1;background:rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;text-align:center;}
.stat-chip .n{font-size:22px;font-weight:800;line-height:1;}
.stat-chip .l{font-size:11px;font-weight:600;opacity:.85;margin-top:3px;}

.menu-section{padding:16px 14px 8px;}
.menu-section-title{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.5px;margin-bottom:8px;}
.menu-card{background:var(--card);border:1.5px solid var(--bdr);border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;margin-bottom:9px;transition:background .12s;}
.menu-card:active{background:var(--card2);}
.menu-ic{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.ic-blue{background:rgba(37,99,235,.1);}
.ic-grn{background:rgba(22,163,74,.1);}
.ic-amb{background:rgba(217,119,6,.1);}
.ic-pur{background:rgba(124,58,237,.1);}
.ic-red{background:rgba(220,38,38,.1);}
.ic-gray{background:rgba(107,114,128,.1);}
.menu-txt{flex:1;}
.menu-nm{font-size:15px;font-weight:700;}
.menu-desc{font-size:12px;color:var(--t2);margin-top:3px;}
.menu-badge{font-size:12px;font-weight:700;color:var(--blue);flex-shrink:0;}
.menu-arrow{color:var(--t3);font-size:17px;flex-shrink:0;}
</style>
</head>
<body>
<div class="page">
  <header class="hdr">
    <span class="hdr-t">명함 CRM</span>
    <div class="hdr-icon" onclick="location.href='settings.html'">⚙️</div>
  </header>
  <div class="body">

    <!-- 오늘 방문 예정 -->
    <div id="today-visits-wrap" style="display:none;">
      <div class="menu-section" style="padding-bottom:0;">
        <div class="menu-section-title" style="color:var(--red);">📅 오늘 방문 예정</div>
      </div>
      <div id="today-visits" style="padding:0 14px 8px;display:flex;flex-direction:column;gap:8px;"></div>
    </div>

    <!-- 배너 + 통계 -->
    <div class="home-banner">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="home-logo">BUSINESS CARD CRM</div>
        <div style="font-size:11px;font-weight:700;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:20px;">v5.5</div>
      </div>
      <div class="home-title">명함 관리 시스템</div>
      <div class="home-date" id="today-date"></div>
      <div class="stat-row">
        <div class="stat-chip"><div class="n" id="s-cards">0</div><div class="l">명함</div></div>
        <div class="stat-chip"><div class="n" id="s-cos">0</div><div class="l">거래처</div></div>
        <div class="stat-chip"><div class="n" id="s-visits">0</div><div class="l">방문</div></div>
      </div>
    </div>

    <!-- 주요 기능 -->
    <div class="menu-section">
      <div class="menu-section-title">명함 관리</div>

      <div class="menu-card" onclick="document.getElementById('cam-inp').click()">
        <div class="menu-ic ic-blue">📷</div>
        <div class="menu-txt">
          <div class="menu-nm">명함 스캔</div>
          <div class="menu-desc">카메라로 명함을 촬영하고 자동 저장</div>
        </div>
        <div class="menu-arrow">›</div>
      </div>

      <div class="menu-card" onclick="document.getElementById('gal-inp').click()">
        <div class="menu-ic ic-blue">🖼️</div>
        <div class="menu-txt">
          <div class="menu-nm">갤러리 스캔</div>
          <div class="menu-desc">사진첩에서 명함 사진을 선택해 저장</div>
        </div>
        <div class="menu-arrow">›</div>
      </div>

      <div class="menu-card" onclick="location.href='cards.html'">
        <div class="menu-ic ic-blue">🪪</div>
        <div class="menu-txt">
          <div class="menu-nm">명함 목록</div>
          <div class="menu-desc">저장된 명함 검색 · 조회 · 즐겨찾기</div>
        </div>
        <div class="menu-badge" id="b-cards"></div>
        <div class="menu-arrow">›</div>
      </div>
    </div>

    <!-- 거래처·방문 -->
    <div class="menu-section">
      <div class="menu-section-title">영업 관리</div>

      <div class="menu-card" onclick="location.href='cos.html'">
        <div class="menu-ic ic-grn">🏢</div>
        <div class="menu-txt">
          <div class="menu-nm">거래처 관리</div>
          <div class="menu-desc">회사별 명함·방문이력 통합 관리</div>
        </div>
        <div class="menu-badge" id="b-cos"></div>
        <div class="menu-arrow">›</div>
      </div>

      <div class="menu-card" onclick="location.href='visits.html'">
        <div class="menu-ic ic-amb">📝</div>
        <div class="menu-txt">
          <div class="menu-nm">방문 기록</div>
          <div class="menu-desc">미팅·상담·견적 방문 이력 관리</div>
        </div>
        <div class="menu-badge" id="b-visits"></div>
        <div class="menu-arrow">›</div>
      </div>

      <div class="menu-card" onclick="location.href='map.html'">
        <div class="menu-ic ic-pur">🗺️</div>
        <div class="menu-txt">
          <div class="menu-nm">거래처 지도</div>
          <div class="menu-desc">주변 거래처 위치 확인</div>
        </div>
        <div class="menu-arrow">›</div>
      </div>
    </div>

    <!-- 설정 -->
    <div class="menu-section">
      <div class="menu-section-title">시스템</div>

      <div class="menu-card" onclick="location.href='settings.html'">
        <div class="menu-ic ic-gray">⚙️</div>
        <div class="menu-txt">
          <div class="menu-nm">설정</div>
          <div class="menu-desc">API 키 · 데이터 초기화</div>
        </div>
        <div class="menu-arrow">›</div>
      </div>
    </div>

    <div style="height:16px;"></div>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<input type="file" id="cam-inp" accept="image/*" capture="environment" style="display:none">
<input type="file" id="gal-inp" accept="image/*" style="display:none">
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
document.getElementById('cam-inp').onchange = function(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => { sessionStorage.setItem('camImg', ev.target.result); location.href='scan.html'; };
  r.readAsDataURL(f); e.target.value='';
};
document.getElementById('gal-inp').onchange = function(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => { sessionStorage.setItem('galImg', ev.target.result); location.href='scan.html?gal=1'; };
  r.readAsDataURL(f); e.target.value='';
};
function load(){
  const cards=DB.getCards(), cos=DB.getCos(), visits=DB.getVisits();
  document.getElementById('s-cards').textContent=cards.length;
  document.getElementById('s-cos').textContent=cos.length;
  document.getElementById('s-visits').textContent=visits.length;
  document.getElementById('b-cards').textContent=cards.length+'장';
  document.getElementById('b-cos').textContent=cos.length+'개';
  document.getElementById('b-visits').textContent=visits.length+'건';

  const now=new Date();
  const days=['일','월','화','수','목','금','토'];
  document.getElementById('today-date').textContent=
    `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]})`;
}
renderTabBar('home');
load();

function loadTodayVisits() {
  const today = new Date().toISOString().split('T')[0];
  const visits = DB.getVisits().filter(v=>v.next===today);
  const wrap = document.getElementById('today-visits-wrap');
  const el = document.getElementById('today-visits');
  if(!visits.length){ wrap.style.display='none'; return; }
  wrap.style.display='block';
  el.innerHTML = visits.map(v=>`
    <div class="menu-card" onclick="location.href='cos.html'" style="border-color:var(--red);background:#fff5f5;">
      <div class="menu-ic" style="background:var(--red-lt);">📅</div>
      <div class="menu-txt">
        <div class="menu-nm">${v.co}</div>
        <div class="menu-desc">${v.tp} · 오늘 방문 예정</div>
      </div>
    </div>`).join('');
}
loadTodayVisits();
</script>
</body>
</html>
