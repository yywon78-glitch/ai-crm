<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>명함 스캔</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; color:#fff; font-family:sans-serif; height:100vh; overflow:hidden; }

/* API 키 입력 화면 */
#key-screen {
  display:none; position:fixed; inset:0;
  background:#111; align-items:center; justify-content:center; flex-direction:column; gap:20px; padding:30px;
}
#key-screen h2 { font-size:20px; text-align:center; }
#key-screen p  { font-size:13px; color:#aaa; text-align:center; line-height:1.6; }
#key-input {
  width:100%; padding:14px; border-radius:10px; font-size:14px;
  background:#222; border:1.5px solid #444; color:#fff; outline:none;
}
#key-input:focus { border-color:#4a9eff; }
#key-save-btn {
  width:100%; padding:15px; border-radius:12px; font-size:17px; font-weight:700;
  background:#4a9eff; border:none; color:#fff; cursor:pointer;
}

/* 카메라 화면 */
#video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; }
#capture-btn {
  position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
  width:72px; height:72px; border-radius:50%;
  background:#fff; border:4px solid rgba(255,255,255,0.4);
  cursor:pointer; z-index:10;
}
#gallery-btn {
  position:fixed; bottom:52px; left:calc(50% - 90px);
  width:48px; height:48px; border-radius:10px;
  background:rgba(255,255,255,0.2); border:none;
  color:#fff; font-size:22px; cursor:pointer; z-index:10;
}

/* 로딩 */
#loading {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8);
  z-index:30; align-items:center; justify-content:center; flex-direction:column; gap:16px;
}
.spinner {
  width:48px; height:48px; border:4px solid rgba(255,255,255,0.2);
  border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* 결과 화면 */
#result-view {
  display:none; position:fixed; inset:0; background:#111;
  flex-direction:column; z-index:20;
}
#result-header {
  background:#222; padding:16px;
  display:flex; align-items:center; gap:12px; flex-shrink:0;
}
#back-btn { background:none; border:none; color:#fff; font-size:24px; cursor:pointer; }
#result-header span { font-size:17px; font-weight:700; }
#result-body { flex:1; overflow-y:auto; padding:20px; font-size:16px; line-height:1.8; white-space:pre-wrap; }

#file-input { display:none; }
</style>
</head>
<body>

<!-- API 키 입력 (최초 1회) -->
<div id="key-screen">
  <h2>🔑 API 키 입력</h2>
  <p>Anthropic API 키를 입력하세요.<br>한 번만 입력하면 저장됩니다.</p>
  <input id="key-input" type="text" placeholder="sk-ant-...">
  <button id="key-save-btn" onclick="saveKey()">시작하기</button>
</div>

<!-- 카메라 -->
<video id="video" autoplay playsinline muted></video>
<button id="gallery-btn" onclick="document.getElementById('file-input').click()">🖼️</button>
<button id="capture-btn" onclick="capture()"></button>
<input type="file" id="file-input" accept="image/*">

<!-- 로딩 -->
<div id="loading">
  <div class="spinner"></div>
  <div>분석 중...</div>
</div>

<!-- 결과 -->
<div id="result-view">
  <div id="result-header">
    <button id="back-btn" onclick="goBack()">←</button>
    <span>추출 결과</span>
  </div>
  <div id="result-body"></div>
</div>

<script>
const WORKSPACE_ID = 'wrkspc_01JvEVBZd9wRRDzxSXfGDGxQ';

// API 키 확인
let API_KEY = localStorage.getItem('crm_key') || '';
if (!API_KEY) {
  document.getElementById('key-screen').style.display = 'flex';
} else {
  startCamera();
}

function saveKey() {
  const k = document.getElementById('key-input').value.replace(/[^\x20-\x7E]/g,'').trim();
  if (!k) { alert('키를 입력해주세요'); return; }
  API_KEY = k;
  localStorage.setItem('crm_key', k);
  document.getElementById('key-screen').style.display = 'none';
  startCamera();
}

function startCamera() {
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } })
    .then(s => document.getElementById('video').srcObject = s)
    .catch(() => {});
}

function capture() {
  const v = document.getElementById('video');
  if (!v.videoWidth) return;
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  analyze(c.toDataURL('image/jpeg', 0.85));
}

document.getElementById('file-input').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => analyze(ev.target.result);
  r.readAsDataURL(f);
  e.target.value = '';
};

async function analyze(dataUrl) {
  document.getElementById('loading').style.display = 'flex';
  try {
    const base64 = dataUrl.split(',')[1];
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': API_KEY,
        'anthropic-workspace-id': WORKSPACE_ID,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-5',
        max_tokens: 1024,
        messages: [{ role:'user', content: [
          { type:'image', source:{ type:'base64', media_type:'image/jpeg', data:base64 } },
          { type:'text', text:'이 명함의 모든 텍스트를 그대로 읽어줘.' }
        ]}]
      })
    });
    const buf = await res.arrayBuffer();
    const data = JSON.parse(new TextDecoder('utf-8').decode(buf));
    const text = data.content?.[0]?.text || data.error?.message || '읽기 실패';
    document.getElementById('result-body').textContent = text;
    document.getElementById('result-view').style.display = 'flex';
  } catch(e) {
    alert('오류: ' + e.message);
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

function goBack() {
  document.getElementById('result-view').style.display = 'none';
}
</script>
</body>
</html>
