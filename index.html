<script>
(function(){
  function fileToDataUrl(file){
    return new Promise(resolve=>{
      const r=new FileReader();
      r.onload=ev=>{
        const img=new Image();
        img.onload=()=>{
          const maxW=1600,scale=Math.min(1,maxW/Math.max(img.width,img.height));
          const c=document.createElement('canvas');
          c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          resolve(c.toDataURL('image/jpeg',0.9));
        };
        img.src=ev.target.result;
      };
      r.readAsDataURL(file);
    });
  }
  document.getElementById('inp-cam').onchange=function(e){
    const f=e.target.files[0];if(!f)return;e.target.value='';
    fileToDataUrl(f).then(data=>{
      sessionStorage.removeItem('scan_queue');
      sessionStorage.setItem('scan_data',data);
      sessionStorage.setItem('scan_back','cards.html');
      location.href='scan.html';
    });
  };
  document.getElementById('inp-gal').onchange=function(e){
    const files=[...e.target.files];if(!files.length)return;e.target.value='';
    Promise.all(files.map(fileToDataUrl)).then(async urls=>{
      sessionStorage.setItem('scan_data', urls[0]);
      sessionStorage.setItem('scan_back', 'cards.html');
      sessionStorage.setItem('scan_idx',  '1');
      sessionStorage.setItem('scan_total', String(urls.length));
      sessionStorage.removeItem('scan_queue');
      /* ?섎㉧吏 ?대?吏??IndexedDB???????sessionStorage 5MB ?쒕룄 ?고쉶 */
      if(urls.length > 1){
        await Promise.all(urls.slice(1).map((url,i)=>ImgDB.set('_sq_'+i, url)));
        sessionStorage.setItem('scan_queue_idb', String(urls.length-1));
      } else {
        sessionStorage.removeItem('scan_queue_idb');
      }
      location.href='scan.html';
    }).catch(()=>{ location.href='scan.html'; });
  };
})();

function load(){
  const cards=DB.getCards(),cos=DB.getCos(),visits=DB.getVisits();
  const now=new Date();
  const days=['??,'??,'??,'??,'紐?,'湲?,'??];

}

function loadTodayVisits(){
  const today=new Date().toISOString().split('T')[0];
  const visits=DB.getVisits().filter(v=>v.next===today);
  const wrap=document.getElementById('today-visits-wrap');
  const el=document.getElementById('today-visits');
  if(!visits.length){wrap.style.display='none';return;}
  wrap.style.display='block';
  el.innerHTML=visits.map(v=>`
    <div class="hw-today-item" onclick="location.href='visits.html'">
      <span class="hw-today-ic">?뱟</span>
      <div><div class="hw-today-nm">${v.co}</div><div class="hw-today-sub">${v.tp} 쨌 ?ㅻ뒛 諛⑸Ц ?덉젙</div></div>
    </div>`).join('');
}
