<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>설정</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="page">
  <header class="hdr">
    <div class="hdr-back" onclick="history.back()">←</div>
    <span class="hdr-t">설정</span>
  </header>
  <div class="body">
    <div style="height:8px;"></div>

    <div class="set-grp">
      <div class="set-lbl">API 연동</div>
      <div class="set-item" onclick="editKey()">
        <span class="set-ic">🔑</span>
        <div class="set-txt"><div class="set-t">Anthropic API 키</div><div class="set-s" id="key-status">미설정</div></div>
        <span class="set-arrow">›</span>
      </div>
    </div>

    <div class="set-grp">
      <div class="set-lbl">데이터</div>
      <div class="set-item" onclick="confirmReset()">
        <span class="set-ic">🗑</span>
        <div class="set-txt"><div class="set-t">데이터 초기화</div><div class="set-s">샘플 데이터로 되돌리기</div></div>
        <span class="set-arrow">›</span>
      </div>
    </div>

    <div class="set-grp">
      <div class="set-lbl">앱 정보</div>
      <div class="set-item">
        <span class="set-ic">ℹ️</span>
        <div class="set-txt"><div class="set-t">버전</div><div class="set-s">v2.0 · Phase 1 MVP</div></div>
      </div>
    </div>
  </div>
</div>

<!-- API 키 편집 모달 -->
<div class="moverlay" id="modal-key" onclick="if(event.target===this)closeKeyModal()">
  <div class="msheet">
    <div class="m-handle"></div>
    <div class="m-title">Anthropic API 키</div>
    <div class="m-body">
      <div><div class="flb">API 키</div><input class="finp" id="key-inp" type="password" placeholder="sk-ant-..."></div>
      <div style="font-size:12px;color:var(--t2);">console.anthropic.com에서 발급받을 수 있습니다.</div>
      <button class="m-btn" onclick="saveKey()">저장</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="nav.js"></script>
<script>
function load(){
  const k=DB.getKey();
  document.getElementById('key-status').textContent = k ? `설정됨 (${k.slice(0,12)}...)` : '미설정';
}

function editKey(){
  document.getElementById('key-inp').value=DB.getKey();
  document.getElementById('modal-key').classList.add('show');
}
function closeKeyModal(){ document.getElementById('modal-key').classList.remove('show'); }
function saveKey(){
  const k=document.getElementById('key-inp').value.trim();
  DB.setKey(k);
  closeKeyModal();
  load();
  toast('API 키가 저장됐습니다 ✓');
}

function confirmReset(){
  if(confirm('모든 데이터를 초기화하고 샘플 데이터로 되돌립니다. 계속하시겠습니까?')){
    localStorage.removeItem('crm_cards');
    localStorage.removeItem('crm_cos');
    localStorage.removeItem('crm_visits');
    toast('초기화 완료 ✓');
  }
}

load();
</script>
</body>
</html>
