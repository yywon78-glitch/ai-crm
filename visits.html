<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>방문기록</title>
<link rel="stylesheet" href="shared.css">
<style>
.tl-targets{font-size:12px;color:var(--blue);margin:2px 0;}
.tl-time{font-size:11px;color:var(--t3);}
.target-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;background:var(--blue-lt);border:1.5px solid var(--blue);border-radius:20px;font-size:12px;color:var(--blue);cursor:pointer;margin:3px 4px 3px 0;}
.target-chip.on{background:var(--blue);color:#fff;}
</style>
</head>
<body>
<div class="page">
  <header class="hdr">
    <span class="hdr-t">방문기록</span>
    <button class="hdr-btn" onclick="openAddModal()">+ 기록</button>
  </header>
  <div class="pills">
    <div class="pill on" onclick="setFilter('all',this)">전체</div>
    <div class="pill"    onclick="setFilter('month',this)">이번달</div>
    <div class="pill"    onclick="setFilter('상담',this)">💬 상담</div>
    <div class="pill"    onclick="setFilter('견적',this)">📄 견적</div>
    <div class="pill"    onclick="setFilter('인사',this)">🤝 인사</div>
  </div>
  <div class="body"><div class="tl" id="list" style="padding:14px;"></div></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- 거래처 오버레이 -->
<div class="overlay" id="overlay-co" style="z-index:100;"></div>

<!-- 방문기록 추가 모달 -->
<div class="moverlay" id="modal-add" style="z-index:200;" onclick="if(event.target===this)closeAddModal()">
  <div class="msheet" style="max-height:92vh;">
    <div class="m-handle"></div>
    <div class="m-title">방문기록 추가</div>
    <div class="m-body">

      <!-- 거래처 -->
      <div>
        <div class="flb">거래처 *</div>
        <select class="finp" id="a-co" onchange="onCoChange()" style="appearance:none;-webkit-appearance:none;"></select>
      </div>

      <!-- 대상자 -->
      <div>
        <div class="flb">대상자</div>
        <div id="target-chips" style="min-height:32px;"></div>
        <input class="finp" id="a-target-extra" placeholder="직접 입력 (없으면 생략)" style="margin-top:6px;">
      </div>

      <!-- 방문 유형 -->
      <div>
        <div class="flb">방문 유형</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;" id="a-type-grid"></div>
      </div>

      <!-- 날짜 + 시각 -->
      <div style="display:flex;gap:8px;">
        <div style="flex:1;"><div class="flb">방문 날짜 *</div><input class="finp" type="date" id="a-dt"></div>
        <div style="width:110px;"><div class="flb">방문 시각</div><input class="finp" type="time" id="a-time"></div>
      </div>

      <!-- 방문 내용 -->
      <div>
        <div class="flb">방문 내용</div>
        <textarea class="finp" id="a-content" rows="4" style="resize:none;" placeholder="미팅 내용, 논의 사항, 결과 등을 입력하세요..."></textarea>
      </div>

      <!-- 다음 일정 -->
      <div><div class="flb">다음 일정</div><input class="finp" type="date" id="a-next"></div>

      <button class="m-btn" onclick="saveVisit()">저장</button>
    </div>
  </div>
</div>

<!-- 거래처 오버레이 내 방문기록 모달 (nav.js 공통) -->
<div class="moverlay" id="modal-visit" style="z-index:210;" onclick="if(event.target===this)closeVisitModal()">
  <div class="msheet">
    <div class="m-handle"></div>
    <div class="m-title">방문기록 추가</div>
    <div class="m-body">
      <div style="font-size:13px;font-weight:600;color:var(--blue);padding:2px 0;" id="v-co-lbl"></div>
      <div>
        <div class="flb">방문 유형</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;" id="type-grid"></div>
      </div>
      <div><div class="flb">방문 날짜</div><input class="finp" type="date" id="v-dt"></div>
      <div><div class="flb">메모</div><textarea class="finp" id="v-memo" rows="3" style="resize:none;" placeholder="미팅 내용 입력..."></textarea></div>
      <div><div class="flb">다음 일정</div><input class="finp" type="date" id="v-next"></div>
      <button class="m-btn" onclick="saveVisit()">저장</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="nav.js"></script>
<script>
const VTYPES = ['🤝 인사','💬 상담','📄 견적','🔧 AS','🍽 식사','📞 전화'];
let _filter = 'all';

function setFilter(f, el) {
  _filter = f;
  document.querySelectorAll('.pills .pill').forEach(p=>p.classList.remove('on'));
  el.classList.add('on');
  render();
}

function render() {
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  let list = DB.getVisits();
  if(_filter==='month') list = list.filter(v=>v.dt.startsWith(ym));
  else if(_filter!=='all') list = list.filter(v=>v.tp.includes(_filter));

  const el = document.getElementById('list');
  if(!list.length){
    el.innerHTML = `<div class="empty"><div class="empty-ic">📋</div><div class="empty-t">방문기록이 없습니다</div></div>`;
    return;
  }
  el.innerHTML = list.map(v=>{
    const targets = v.targets && v.targets.length ? v.targets.join(', ') : (v.targetExtra||'');
    const timeStr = v.time ? ` ${v.time}` : '';
    const content = v.content || v.memo || '';
    return `<div class="tl-item" onclick="openCoOverlay('${v.coId}')">
      <div class="tl-dot">${v.tp.split(' ')[0]}</div>
      <div class="tl-body">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div class="tl-tp">${v.tp}</div>
          <div class="tl-dt tl-time">${v.dt}${timeStr}</div>
        </div>
        <div style="font-size:13px;font-weight:700;color:var(--blue);margin:3px 0;">${v.co}</div>
        ${targets ? `<div class="tl-targets">👤 ${targets}</div>` : ''}
        ${content ? `<div class="tl-memo">${content}</div>` : ''}
        ${v.next ? `<div class="tl-next">📅 다음 일정: ${v.next}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

/* ── 추가 모달 ── */
let _selTargets = new Set();

function openAddModal() {
  _selTargets = new Set();
  const cos = DB.getCos();
  document.getElementById('a-co').innerHTML =
    `<option value="">— 거래처 선택 —</option>` +
    cos.map(c=>`<option value="${c.id}">${c.nm}</option>`).join('');
  document.getElementById('a-dt').value = new Date().toISOString().split('T')[0];
  document.getElementById('a-time').value = '';
  document.getElementById('a-content').value = '';
  document.getElementById('a-next').value = '';
  document.getElementById('a-target-extra').value = '';
  document.getElementById('target-chips').innerHTML = '';
  const g = document.getElementById('a-type-grid');
  g.innerHTML = VTYPES.map(t=>`<div class="bx b-bl" style="cursor:pointer;padding:7px 12px;" onclick="_selType(this)">${t}</div>`).join('');
  _selType(g.children[0]);
  document.getElementById('modal-add').classList.add('show');
}

function closeAddModal() {
  document.getElementById('modal-add').classList.remove('show');
}

function _selType(el) {
  document.querySelectorAll('#a-type-grid .bx').forEach(b=>{ b.style.background=''; b.style.border=''; b.style.color=''; delete b.dataset.on; });
  el.style.background='var(--blue-lt)'; el.style.border='1.5px solid var(--blue)'; el.style.color='var(--blue)'; el.dataset.on='1';
}

function onCoChange() {
  const coId = document.getElementById('a-co').value;
  const cards = DB.getCards().filter(c=>c.coId===coId || (coId && DB.getCos().find(x=>x.id===coId)?.nm===c.co));
  _selTargets = new Set();
  const wrap = document.getElementById('target-chips');
  if(!cards.length){ wrap.innerHTML=''; return; }
  wrap.innerHTML = cards.map(c=>
    `<span class="target-chip" data-nm="${c.nm}" onclick="_toggleTarget(this)">${c.nm}<small style="margin-left:3px;opacity:.7;">${c.tl||''}</small></span>`
  ).join('');
}

function _toggleTarget(el) {
  const nm = el.dataset.nm;
  if(_selTargets.has(nm)){ _selTargets.delete(nm); el.classList.remove('on'); }
  else { _selTargets.add(nm); el.classList.add('on'); }
}

function saveVisit() {
  const coId = document.getElementById('a-co').value;
  if(!coId){ toast('거래처를 선택해주세요'); return; }
  const co = DB.getCos().find(c=>c.id===coId);
  const dt = document.getElementById('a-dt').value;
  if(!dt){ toast('날짜를 입력해주세요'); return; }

  const selEl = [...document.querySelectorAll('#a-type-grid .bx')].find(b=>b.dataset.on);
  const tp = selEl ? selEl.textContent : VTYPES[0];
  const targets = [..._selTargets];
  const targetExtra = document.getElementById('a-target-extra').value.trim();
  const time = document.getElementById('a-time').value;
  const content = document.getElementById('a-content').value.trim();
  const next = document.getElementById('a-next').value || null;

  const visits = DB.getVisits();
  visits.unshift({
    id: 'v'+Date.now(),
    co: co?.nm||'', coId,
    tp, dt, time,
    targets, targetExtra,
    content, memo: content,
    next
  });
  DB.setVisits(visits);
  closeAddModal();
  render();
  toast('방문기록이 저장됐습니다 ✓');
}

renderTabBar('visits');
render();
</script>
</body>
</html>
