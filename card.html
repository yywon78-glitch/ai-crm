<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>명함 상세</title>
<link rel="stylesheet" href="shared.css?v=1029">
<style>
.back-bar{position:fixed;bottom:0;left:0;right:0;padding:10px 14px env(safe-area-inset-bottom,16px);background:var(--bg);border-top:1px solid var(--bdr);z-index:50;}
.back-bar-btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--card);border:1.5px solid var(--bdr);font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation;color:var(--t1);}
</style>
</head>
<body>
<div class="page">
  <header class="hdr">
    <div class="hdr-back" onclick="history.length>1?history.back():location.href='cards.html'">←</div>
    <span class="hdr-t">명함 상세</span>
    <div class="hdr-icon" id="fav-btn" onclick="toggleFav()">☆</div>
    <div class="hdr-icon" onclick="toast('편집 기능 준비 중')">✏️</div>
  </header>
  <div class="body">
    <div class="det-hero">
      <div class="det-av" id="card-av"></div>
      <div>
        <div class="det-nm" id="card-nm"></div>
        <div class="det-tl" id="card-tl"></div>
        <div class="det-co" id="card-co" onclick="goToCo()"></div>
      </div>
    </div>
    <div class="info-sec" id="info-sec"></div>
    <div class="orig-wrap">
      <div class="orig-hdr">📷 명함 원본</div>
      <div class="orig-ph" id="orig-ph">이미지 저장됨</div>
      <img id="orig-img" style="width:100%;border-radius:8px;display:none;">
    </div>
    <button class="action-btn" onclick="openVisitModal()">📝 방문 기록 추가</button>
    <div class="sec-hdr"><h3>방문 이력</h3></div>
    <div class="tl" id="visit-tl"></div>
    <div style="height:88px;"></div>
  </div>
</div>

<div class="back-bar">
  <button class="back-bar-btn" onclick="history.length>1?history.back():location.href='cards.html'">← 뒤로가기</button>
</div>

<!-- 방문 기록 모달 -->
<div class="moverlay" id="modal-visit" onclick="if(event.target===this)closeVisitModal()">
  <div class="msheet">
    <div class="m-handle"></div>
    <div class="m-title">방문 기록 추가</div>
    <div class="m-body">
      <div>
        <div class="flb">방문 유형</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;" id="type-grid"></div>
      </div>
      <div><div class="flb">방문 날짜</div><input class="finp" type="date" id="v-dt"></div>
      <div><div class="flb">메모</div><textarea class="finp" id="v-memo" rows="3" placeholder="미팅 내용을 입력하세요..." style="resize:none;"></textarea></div>
      <div><div class="flb">다음 일정</div><input class="finp" type="date" id="v-next"></div>
      <button class="m-btn" onclick="saveVisit()">저장</button>
    </div>
  </div>
</div>

<script src="data.js?v=1029"></script>
<script src="nav.js?v=1029"></script>
<script>
const TYPES = ['🤝 인사','💬 상담','📄 견적','🔧 AS','🍽 식사','📞 전화'];
const id = qp('id');
let card = null;

function load(){
  card = DB.getCards().find(c=>c.id===id) || DB.getDriveShared().find(c=>c.id===id);
  if(!card){ history.back(); return; }

  document.getElementById('card-av').textContent = card.nm[0];
  document.getElementById('card-av').style.cssText = `background:${card.cl}18;color:${card.cl}`;
  document.getElementById('card-nm').textContent = card.nm;
  document.getElementById('card-tl').textContent = card.tl||'';
  document.getElementById('card-co').textContent = card.co||'';
  document.getElementById('fav-btn').textContent = card.fav ? '★' : '☆';

  const rows = [
    card.mob && {ic:'📱',lbl:'휴대전화',val:card.mob,action:'전화',href:`tel:${card.mob}`},
    card.ph  && {ic:'📞',lbl:'유선전화',val:card.ph, action:'전화',href:`tel:${card.ph}`},
    card.em  && {ic:'✉️',lbl:'이메일',  val:card.em, action:'메일',href:`mailto:${card.em}`},
    card.addr&& {ic:'📍',lbl:'주소',    val:card.addr,action:'지도',href:`map.html?addr=${encodeURIComponent(card.addr)}&nm=${encodeURIComponent(card.co||card.nm)}`},
  ].filter(Boolean);

  document.getElementById('info-sec').innerHTML = rows.map(r=>
    `<div class="info-item">
      <span class="info-ic">${r.ic}</span>
      <div class="info-body"><div class="info-lbl">${r.lbl}</div><div class="info-val">${r.val}</div></div>
      <a class="info-action" href="${r.href}">${r.action}</a>
    </div>`
  ).join('');

  if(card.img){ const img=document.getElementById('orig-img'); img.src=card.img; img.style.display='block'; document.getElementById('orig-ph').style.display='none'; }

  renderVisits();
}

function renderVisits(){
  const visits = DB.getVisits().filter(v=>v.coId && card && DB.getCos().find(c=>c.id===v.coId&&c.nm===card.co));
  const el = document.getElementById('visit-tl');
  if(!visits.length){ el.innerHTML='<div style="padding:16px;font-size:13px;color:var(--t3);text-align:center;">방문 기록이 없습니다</div>'; return; }
  el.innerHTML = visits.map(v=>_visitHtml(v)).join('');
}

function toggleFav(){
  const cards = DB.getCards();
  const c = cards.find(x=>x.id===id);
  if(!c) return;
  c.fav = !c.fav;
  DB.setCards(cards);
  document.getElementById('fav-btn').textContent = c.fav ? '★' : '☆';
  toast(c.fav ? '즐겨찾기에 추가됐습니다 ★' : '즐겨찾기에서 제거됐습니다');
}

function goToCo(){
  const cos = DB.getCos();
  const co = cos.find(c=>c.nm===card.co);
  if(co) location.href=`co.html?id=${co.id}`;
  else toast('등록된 거래처가 없습니다');
}

function openVisitModal(){
  document.getElementById('v-dt').value = new Date().toISOString().split('T')[0];
  document.getElementById('v-memo').value = '';
  document.getElementById('v-next').value = '';
  const g = document.getElementById('type-grid');
  g.innerHTML = TYPES.map((t,i)=>`<div class="bx b-bl" style="cursor:pointer;padding:7px 14px;" onclick="selectType(this)" ${i===0?'data-on="1"':''} style="${i===0?'background:var(--blue-lt);border:1.5px solid var(--blue);':''}">${t}</div>`).join('');
  if(g.children[0]) selectType(g.children[0]);
  document.getElementById('modal-visit').classList.add('show');
}

function closeVisitModal(){
  document.getElementById('modal-visit').classList.remove('show');
}

function selectType(el){
  document.querySelectorAll('#type-grid .bx').forEach(b=>{ b.style.background=''; b.style.border=''; b.style.color=''; });
  el.style.background='var(--blue-lt)'; el.style.border='1.5px solid var(--blue)'; el.style.color='var(--blue)';
  el.dataset.on='1';
}

function saveVisit(){
  const selEl = [...document.querySelectorAll('#type-grid .bx')].find(b=>b.dataset.on);
  const tp = selEl ? selEl.textContent : TYPES[0];
  const dt = document.getElementById('v-dt').value;
  if(!dt){ toast('날짜를 입력해주세요'); return; }
  const cos = DB.getCos();
  const co = cos.find(c=>c.nm===card.co);
  const visits = DB.getVisits();
  visits.unshift({id:'v'+Date.now(), co:card.co, coId:co?co.id:'', tp, dt, memo:document.getElementById('v-memo').value.trim(), next:document.getElementById('v-next').value||null});
  DB.setVisits(visits);
  closeVisitModal();
  renderVisits();
  toast('방문 기록이 저장됐습니다 ✓');
}

load();
</script>
</body>
</html>
