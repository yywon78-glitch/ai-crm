<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>명함 스캔</title>
<link rel="stylesheet" href="shared.css">
<style>
.scan-home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px 24px;}
.scan-illust{font-size:80px;line-height:1;}
.scan-desc{font-size:15px;color:var(--t2);text-align:center;line-height:1.7;}
.scan-btn-wrap{display:flex;flex-direction:column;gap:12px;width:100%;max-width:300px;}
.scan-btn-main{width:100%;padding:18px;border-radius:16px;background:var(--blue);border:none;color:#fff;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;}
.scan-btn-sub{width:100%;padding:15px;border-radius:16px;background:var(--bg);border:1.5px solid var(--bdr);color:var(--t1);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;}

#result-view{display:none;flex-direction:column;}
.res-img-wrap{background:#111;display:flex;align-items:center;justify-content:center;}
.res-img{width:100%;max-height:240px;object-fit:contain;display:block;}
.res-ph{color:rgba(255,255,255,.4);font-size:13px;padding:40px 20px;text-align:center;}
.fgrp{padding:0 14px;margin-bottom:12px;}
</style>
</head>
<body>

<!-- ① 촬영 홈 -->
<div class="page" id="scan-home-view">
  <header class="hdr">
    <div class="hdr-back" onclick="history.back()">←</div>
    <span class="hdr-t">명함 스캔</span>
  </header>
  <div class="scan-home">
    <div class="scan-illust">🪪</div>
    <div class="scan-desc">
      명함을 촬영하면 이름, 연락처, 회사 등<br>정보를 자동으로 인식합니다
    </div>
    <div class="scan-btn-wrap">
      <button class="scan-btn-main" onclick="document.getElementById('inp-cam').click()">
        📷 카메라로 촬영
      </button>
      <button class="scan-btn-sub" onclick="document.getElementById('inp-gal').click()">
        🖼️ 갤러리에서 선택
      </button>
    </div>
  </div>
  <!-- 네이티브 카메라 -->
  <input type="file" id="inp-cam" accept="image/*" capture="environment" style="display:none">
  <!-- 갤러리 -->
  <input type="file" id="inp-gal" accept="image/*" style="display:none">
</div>

<!-- ② OCR 결과 -->
<div id="result-view" class="page">
  <header class="hdr">
    <div class="hdr-back" onclick="backToHome()">←</div>
    <span class="hdr-t">스캔 결과</span>
    <button class="hdr-btn" onclick="saveCard()">저장</button>
  </header>
  <div class="body">
    <div class="res-img-wrap">
      <img id="res-img" class="res-img" style="display:none;">
      <div class="res-ph" id="res-ph">📷 명함 이미지</div>
    </div>
    <div style="height:14px;"></div>
    <div class="fgrp"><div class="flb">이름 *</div><input class="finp" id="f-nm" placeholder="이름"></div>
    <div class="fgrp"><div class="flb">회사</div><input class="finp" id="f-co" placeholder="회사명"></div>
    <div class="fgrp"><div class="flb">직책</div><input class="finp" id="f-tl" placeholder="직책 / 부서"></div>
    <div class="fgrp"><div class="flb">휴대전화</div><input class="finp" id="f-mob" placeholder="010-0000-0000" type="tel"></div>
    <div class="fgrp"><div class="flb">유선전화</div><input class="finp" id="f-ph" placeholder="02-0000-0000" type="tel"></div>
    <div class="fgrp"><div class="flb">이메일</div><input class="finp" id="f-em" placeholder="email@company.com" type="email"></div>
    <div class="fgrp"><div class="flb">주소</div><input class="finp" id="f-addr" placeholder="주소"></div>
    <div style="height:24px;"></div>
  </div>
</div>

<!-- 로딩 -->
<div class="ld" id="ld"><div class="spinner"></div><p id="ld-msg">명함 인식 중...</p></div>

<!-- 오류 -->
<div id="err-box" style="display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.85);align-items:center;justify-content:center;padding:24px;">
  <div style="background:#fff;border-radius:16px;padding:24px;max-width:340px;width:100%;">
    <div style="font-size:16px;font-weight:700;color:#dc2626;margin-bottom:12px;">❌ OCR 오류</div>
    <div id="err-msg" style="font-size:13px;color:#374151;line-height:1.6;word-break:break-all;margin-bottom:20px;"></div>
    <button onclick="document.getElementById('err-box').style.display='none'" style="width:100%;padding:12px;border-radius:10px;background:#dc2626;color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;">확인</button>
  </div>
</div>

<script src="data.js"></script>
<script src="nav.js"></script>
<script>
let captured = null;
const COLORS=['#2563eb','#16a34a','#d97706','#7c3aed','#dc2626','#0891b2'];

function onFile(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>processImage(ev.target.result);
  r.readAsDataURL(f);
  e.target.value='';
}
document.getElementById('inp-cam').onchange=onFile;
document.getElementById('inp-gal').onchange=onFile;

function showErr(msg){
  document.getElementById('ld').classList.remove('show');
  document.getElementById('err-msg').textContent=msg;
  document.getElementById('err-box').style.display='flex';
}

function resizeForOCR(dataUrl, maxW=1600){
  return new Promise(resolve=>{
    const i=new Image();
    i.onload=()=>{
      const w=Math.min(i.width,maxW), h=i.height*(w/i.width);
      const c=document.createElement('canvas');
      c.width=w; c.height=h;
      c.getContext('2d').drawImage(i,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',0.9));
    };
    i.src=dataUrl;
  });
}

async function processImage(dataUrl){
  captured=dataUrl;
  const img=document.getElementById('res-img');
  img.src=dataUrl; img.style.display='block';
  document.getElementById('res-ph').style.display='none';

  const ldMsg=document.getElementById('ld-msg');
  document.getElementById('ld').classList.add('show');

  const apiKey=DB.getKey();
  if(!apiKey){
    document.getElementById('ld').classList.remove('show');
    if(confirm('API 키가 설정되지 않았습니다.\n설정 화면으로 이동할까요?')){
      location.href='settings.html';
    }
    return;
  }

  try{
    ldMsg.textContent='이미지 준비 중...';
    const resized=await resizeForOCR(dataUrl);
    const base64=resized.split(',')[1];
    ldMsg.textContent='AI 명함 인식 중...';

    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
        'anthropic-workspace-id': DB.getWorkspace()||'wrkspc_01Pdf2hnBKy4HbTJCfTcdq9W'
      },
      body:JSON.stringify({
        model:'claude-haiku-4-5-20251001',
        max_tokens:512,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:'image/jpeg',data:base64}},
          {type:'text',text:'이 명함 이미지에서 정보를 추출해 JSON만 반환해. 키: nm(이름),co(회사),tl(직책),mob(휴대전화),ph(유선전화),em(이메일),addr(주소). 없으면 빈 문자열.'}
        ]}]
      })
    });

    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      showErr(`API ${res.status}: ${err.error?.message||JSON.stringify(err)}`);
      return;
    }

    const data=await res.json();
    const text=data.content?.[0]?.text||'';
    if(!text){ showErr('응답 없음: '+JSON.stringify(data)); return; }

    const match=text.match(/\{[\s\S]*\}/);
    if(match){
      const info=JSON.parse(match[0]);
      document.getElementById('f-nm').value  =info.nm  ||'';
      document.getElementById('f-co').value  =info.co  ||'';
      document.getElementById('f-tl').value  =info.tl  ||'';
      document.getElementById('f-mob').value =info.mob ||'';
      document.getElementById('f-ph').value  =info.ph  ||'';
      document.getElementById('f-em').value  =info.em  ||'';
      document.getElementById('f-addr').value=info.addr||'';
    } else {
      showErr('인식 실패:\n\n'+text); return;
    }
  }catch(e){
    showErr(e.message); return;
  }

  document.getElementById('ld').classList.remove('show');
  document.getElementById('scan-home-view').style.display='none';
  document.getElementById('result-view').style.display='flex';
}

function backToHome(){
  document.getElementById('result-view').style.display='none';
  document.getElementById('scan-home-view').style.display='flex';
}

function saveCard(){
  const nm=document.getElementById('f-nm').value.trim();
  if(!nm){ toast('이름을 입력해주세요'); return; }
  const co=document.getElementById('f-co').value.trim();
  const cards=DB.getCards();

  const dup=cards.find(c=>c.nm===nm&&c.co===co);
  if(dup){
    if(!confirm(`이미 등록된 명함입니다.\n\n${nm} / ${co}\n\n업데이트할까요?`)) return;
    dup.tl  =document.getElementById('f-tl').value.trim();
    dup.mob =document.getElementById('f-mob').value.trim();
    dup.ph  =document.getElementById('f-ph').value.trim();
    dup.em  =document.getElementById('f-em').value.trim();
    dup.addr=document.getElementById('f-addr').value.trim();
    if(captured) dup.img=captured;
    DB.setCards(cards);
    toast('업데이트됐습니다 ✓');
    location.href='index.html';
    return;
  }

  cards.unshift({
    id:'c'+Date.now(),nm,co,
    tl:document.getElementById('f-tl').value.trim(),
    mob:document.getElementById('f-mob').value.trim(),
    ph:document.getElementById('f-ph').value.trim(),
    em:document.getElementById('f-em').value.trim(),
    addr:document.getElementById('f-addr').value.trim(),
    tag:'고객',cl:COLORS[Math.floor(Math.random()*COLORS.length)],fav:false,
    img:captured||null
  });
  DB.setCards(cards);
  toast('명함이 저장됐습니다 ✓');
  location.href='index.html';
}
</script>
</body>
</html>
