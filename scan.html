<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>명함 스캔</title>
<link rel="stylesheet" href="shared.css">
<style>
#result-view{display:none;flex-direction:column;}
.res-img-wrap{background:#111;display:flex;align-items:center;justify-content:center;}
.res-img{width:100%;max-height:240px;object-fit:contain;display:block;}
.res-ph{color:rgba(255,255,255,.4);font-size:13px;padding:40px 20px;text-align:center;}
.fgrp{padding:0 14px;margin-bottom:12px;}
#multi-box{display:none;position:fixed;inset:0;z-index:300;background:var(--bg);flex-direction:column;}
</style>
</head>
<body>

<!-- 전체화면 카메라/갤러리 트리거 -->
<div id="cam-trigger" onclick="document.getElementById(_triggerEl).click()" style="position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);gap:16px;cursor:pointer;touch-action:manipulation;">
  <div id="trig-ic" style="font-size:72px;">📷</div>
  <div id="trig-t1" style="font-size:18px;font-weight:700;color:var(--t1);">탭하여 촬영</div>
  <div id="trig-t2" style="font-size:13px;color:var(--t2);">명함을 카메라로 스캔합니다</div>
</div>
<input type="file" id="inp-cam" accept="image/*" capture="environment" style="display:none">
<input type="file" id="inp-gal" accept="image/*" style="display:none">

<!-- 미리보기 + 회전 -->
<div id="preview-view" class="page" style="display:none;">
  <header class="hdr">
    <div class="hdr-back" onclick="backToTrigger()">←</div>
    <span class="hdr-t">사진 확인</span>
    <button class="hdr-btn" onclick="startOCR()" style="min-width:64px;">인식 시작</button>
  </header>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;overflow:hidden;">
    <img id="prev-img" style="max-width:100%;max-height:calc(100vh - 160px);object-fit:contain;display:block;">
  </div>
  <div style="display:flex;gap:12px;padding:16px;background:var(--card);border-top:1px solid var(--bdr);">
    <button onclick="rotatePrev(-90)" style="flex:1;padding:14px;border-radius:12px;background:var(--bg);border:1.5px solid var(--bdr);font-size:20px;cursor:pointer;touch-action:manipulation;">↺ 좌회전</button>
    <button onclick="rotatePrev(90)"  style="flex:1;padding:14px;border-radius:12px;background:var(--bg);border:1.5px solid var(--bdr);font-size:20px;cursor:pointer;touch-action:manipulation;">↻ 우회전</button>
  </div>
</div>

<!-- OCR 결과 (1장) -->
<div id="result-view" class="page">
  <header class="hdr">
    <div class="hdr-back" onclick="history.back()">←</div>
    <span class="hdr-t">스캔 결과</span>
    <button class="hdr-btn" onclick="retake()" style="background:var(--t2);margin-right:6px;">재촬영</button>
    <button class="hdr-btn" onclick="saveCard()">저장</button>
  </header>
  <div class="body">
    <div class="res-img-wrap">
      <img id="res-img" class="res-img" style="display:none;">
      <div class="res-ph" id="res-ph">📷 명함 이미지</div>
    </div>
    <div style="height:14px;"></div>
    <div class="fgrp"><div class="flb">이름 *</div><input class="finp" id="f-nm" placeholder="이름"></div>
    <div class="fgrp"><div class="flb">회사</div><input class="finp" id="f-co" placeholder="회사명"></div>
    <div class="fgrp"><div class="flb">직책</div><input class="finp" id="f-tl" placeholder="직책 / 부서"></div>
    <div class="fgrp"><div class="flb">휴대전화</div><input class="finp" id="f-mob" placeholder="010-0000-0000" type="tel"></div>
    <div class="fgrp"><div class="flb">유선전화</div><input class="finp" id="f-ph" placeholder="02-0000-0000" type="tel"></div>
    <div class="fgrp"><div class="flb">이메일</div><input class="finp" id="f-em" placeholder="email@company.com" type="email"></div>
    <div class="fgrp"><div class="flb">주소</div><input class="finp" id="f-addr" placeholder="주소"></div>
    <div style="height:24px;"></div>
  </div>
</div>

<!-- 여러 명함 선택 저장 -->
<div id="multi-box">
  <header class="hdr">
    <div class="hdr-back" onclick="document.getElementById('multi-box').style.display='none';history.back()">←</div>
    <span class="hdr-t" id="multi-title">명함 선택</span>
    <button class="hdr-btn" onclick="saveMulti()">선택 저장</button>
  </header>
  <div style="padding:12px 14px;font-size:13px;color:var(--t2);">저장할 명함을 선택하세요 (전체 선택됨)</div>
  <div class="body"><div class="bp" id="multi-list"></div></div>
</div>

<!-- 로딩 -->
<div class="ld" id="ld"><div class="spinner"></div><p id="ld-msg">명함 인식 중...</p></div>

<!-- 오류 -->
<div id="err-box" style="display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.85);align-items:center;justify-content:center;padding:24px;">
  <div style="background:#fff;border-radius:16px;padding:24px;max-width:340px;width:100%;">
    <div style="font-size:16px;font-weight:700;color:#dc2626;margin-bottom:12px;">❌ OCR 오류</div>
    <div id="err-msg" style="font-size:13px;color:#374151;line-height:1.6;word-break:break-all;margin-bottom:20px;"></div>
    <button onclick="document.getElementById('err-box').style.display='none';history.back()" style="width:100%;padding:12px;border-radius:10px;background:#dc2626;color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;">확인</button>
  </div>
</div>

<script src="data.js"></script>
<script src="nav.js"></script>
<script>
let captured = null;
let _multiCards = [];
let _prevDataUrl = null;
const COLORS = ['#2563eb','#16a34a','#d97706','#7c3aed','#dc2626','#0891b2'];

// 미리보기 회전
function rotatePrev(deg){
  const src = document.getElementById('prev-img').src;
  const img = new Image();
  img.onload = ()=>{
    const swap = Math.abs(deg) === 90;
    const c = document.createElement('canvas');
    c.width  = swap ? img.height : img.width;
    c.height = swap ? img.width  : img.height;
    const ctx = c.getContext('2d');
    ctx.translate(c.width/2, c.height/2);
    ctx.rotate(deg * Math.PI / 180);
    ctx.drawImage(img, -img.width/2, -img.height/2);
    _prevDataUrl = c.toDataURL('image/jpeg', 0.9);
    document.getElementById('prev-img').src = _prevDataUrl;
  };
  img.src = src;
}

function backToTrigger(){
  document.getElementById('preview-view').style.display = 'none';
  document.getElementById('cam-trigger').style.display = 'flex';
}

function startOCR(){
  document.getElementById('preview-view').style.display = 'none';
  processImage(_prevDataUrl);
}

function onFile(e){
  const f = e.target.files[0];
  if(!f){ history.back(); return; }
  const r = new FileReader();
  r.onload = ev => {
    _prevDataUrl = ev.target.result;
    document.getElementById('cam-trigger').style.display = 'none';
    document.getElementById('prev-img').src = _prevDataUrl;
    document.getElementById('preview-view').style.display = 'flex';
  };
  r.readAsDataURL(f);
  e.target.value = '';
}
document.getElementById('inp-cam').onchange = onFile;
document.getElementById('inp-gal').onchange = onFile;

let _triggerEl = 'inp-cam';
if(new URLSearchParams(location.search).get('gal')){
  _triggerEl = 'inp-gal';
  document.getElementById('trig-ic').textContent='🖼️';
  document.getElementById('trig-t1').textContent='탭하여 갤러리 선택';
  document.getElementById('trig-t2').textContent='사진첩에서 명함을 선택합니다';
}

function retake(){
  document.getElementById('result-view').style.display = 'none';
  document.getElementById('cam-trigger').style.display = 'flex';
}

function showErr(msg){
  document.getElementById('ld').classList.remove('show');
  document.getElementById('err-msg').textContent = msg;
  document.getElementById('err-box').style.display = 'flex';
}

function cropCard(dataUrl, box){
  return new Promise(resolve=>{
    const i = new Image();
    i.onload = ()=>{
      let sx=0, sy=0, sw=i.width, sh=i.height;
      if(box && box.x1!=null){
        sx=Math.max(0,box.x1); sy=Math.max(0,box.y1);
        sw=Math.min(i.width,box.x2)-sx;
        sh=Math.min(i.height,box.y2)-sy;
        if(sw<20||sh<20){ sx=0; sy=0; sw=i.width; sh=i.height; }
      }
      const maxW=600, scale=Math.min(1, maxW/sw);
      const dw=Math.round(sw*scale), dh=Math.round(sh*scale);
      const c=document.createElement('canvas');
      c.width=dw; c.height=dh;
      c.getContext('2d').drawImage(i,sx,sy,sw,sh,0,0,dw,dh);
      resolve(c.toDataURL('image/jpeg',0.78));
    };
    i.onerror = ()=> resolve(null);
    i.src = dataUrl;
  });
}

function resizeForOCR(dataUrl, maxW=1600){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      const sw = img.naturalWidth || img.width;
      const sh = img.naturalHeight || img.height;
      const scale = Math.min(1, maxW / Math.max(sw, sh));
      const c = document.createElement('canvas');
      c.width = Math.round(sw * scale);
      c.height = Math.round(sh * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.9));
    };
    img.src = dataUrl;
  });
}

async function processImage(dataUrl){
  captured = dataUrl;

  const ldMsg = document.getElementById('ld-msg');
  document.getElementById('ld').classList.add('show');

  const apiKey = DB.getKey();
  if(!apiKey){
    document.getElementById('ld').classList.remove('show');
    if(confirm('API 키가 설정되지 않았습니다.\n설정 화면으로 이동할까요?')) location.href='settings.html';
    return;
  }

  try{
    ldMsg.textContent = '이미지 준비 중...';
    const resized = await resizeForOCR(dataUrl);
    captured = resized;
    const base64 = resized.split(',')[1];
    ldMsg.textContent = 'AI 명함 인식 중...';

    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
        'anthropic-workspace-id': DB.getWorkspace()||'wrkspc_01Pdf2hnBKy4HbTJCfTcdq9W'
      },
      body: JSON.stringify({
        model:'claude-haiku-4-5-20251001',
        max_tokens: 2048,
        messages:[{role:'user', content:[
          {type:'image', source:{type:'base64', media_type:'image/jpeg', data:base64}},
          {type:'text', text:'명함 이미지에서 정보를 추출해. JSON 배열만 반환(다른 텍스트 없이). 형식: [{nm,co,tl,mob,ph,em,addr},...]. 규칙: nm(이름)과 co(회사명)는 한글이 있으면 무조건 한글로 적어. 영문만 있을 때만 영문 사용. tl=직책/부서, mob=휴대전화(010-), ph=유선전화(02- 등), em=이메일, addr=주소. 전화번호는 하이픈 포함. 명함이 1장이어도 배열로. 없는 필드는 빈 문자열.'}
        ]}]
      })
    });

    if(!res.ok){
      const err = await res.json().catch(()=>({}));
      showErr(`API ${res.status}: ${err.error?.message||JSON.stringify(err)}`);
      return;
    }

    const data = await res.json();
    const text = data.content?.[0]?.text || '';
    if(!text){ showErr('응답 없음: '+JSON.stringify(data)); return; }

    const arrMatch = text.match(/\[[\s\S]*\]/);
    if(!arrMatch){ showErr('인식 실패:\n\n'+text); return; }

    const cards = JSON.parse(arrMatch[0]);
    document.getElementById('ld').classList.remove('show');

    if(!cards.length){ showErr('명함을 찾을 수 없습니다'); return; }

    if(cards.length === 1){
      // 미리보기는 원본 dataUrl 유지 (브라우저가 EXIF 올바르게 표시)
      // captured는 OCR용 resized 저장
      fillForm(cards[0]);
      document.getElementById('cam-trigger').style.display = 'none';
      document.getElementById('result-view').style.display = 'flex';
    } else {
      showMulti(cards);
    }

  }catch(e){
    showErr(e.message);
  }
}

function fillForm(info){
  document.getElementById('f-nm').value   = info.nm   || '';
  document.getElementById('f-co').value   = info.co   || '';
  document.getElementById('f-tl').value   = info.tl   || '';
  document.getElementById('f-mob').value  = info.mob  || '';
  document.getElementById('f-ph').value   = info.ph   || '';
  document.getElementById('f-em').value   = info.em   || '';
  document.getElementById('f-addr').value = info.addr || '';
}

function showMulti(cards){
  _multiCards = cards;
  document.getElementById('multi-title').textContent = `명함 ${cards.length}장 인식됨`;
  document.getElementById('multi-list').innerHTML = cards.map((c,i)=>`
    <label style="display:flex;align-items:flex-start;gap:12px;padding:14px;background:var(--card);border:1.5px solid var(--bdr);border-radius:12px;cursor:pointer;margin-bottom:9px;">
      <input type="checkbox" checked data-i="${i}" style="width:18px;height:18px;margin-top:3px;flex-shrink:0;accent-color:var(--blue);">
      <div style="flex:1;">
        <div style="font-size:15px;font-weight:700;">${c.nm||'(이름없음)'} <span style="font-size:12px;font-weight:400;color:var(--t2);">${c.tl||''}</span></div>
        <div style="font-size:13px;color:var(--blue);margin-top:2px;">${c.co||''}</div>
        <div style="font-size:12px;color:var(--t2);margin-top:2px;">${[c.mob,c.ph,c.em].filter(Boolean).join(' · ')}</div>
      </div>
    </label>`).join('');
  document.getElementById('cam-trigger').style.display = 'none';
  document.getElementById('multi-box').style.display = 'flex';
}

function saveMulti(){
  const selected = [...document.querySelectorAll('#multi-list input[type=checkbox]:checked')]
    .map(el => _multiCards[+el.dataset.i]);
  if(!selected.length){ toast('저장할 명함을 선택해주세요'); return; }

  const saved = DB.getCards();
  let added=0, updated=0;
  selected.forEach(info=>{
    const nm=(info.nm||'').trim(); if(!nm) return;
    const co=(info.co||'').trim();
    const dup = saved.find(c=>c.nm===nm&&c.co===co);
    if(dup){
      Object.assign(dup,{tl:info.tl||'',mob:info.mob||'',ph:info.ph||'',em:info.em||'',addr:info.addr||''});
      updated++;
    } else {
      saved.unshift({id:'c'+Date.now()+Math.random(),nm,co,
        tl:info.tl||'',mob:info.mob||'',ph:info.ph||'',em:info.em||'',addr:info.addr||'',
        tag:'고객',cl:COLORS[Math.floor(Math.random()*COLORS.length)],fav:false,img:null});
      added++;
    }
  });
  DB.setCards(saved);
  document.getElementById('multi-box').style.display = 'none';
  toast(`저장 ${added}장, 업데이트 ${updated}장 ✓`);
  setTimeout(()=>location.href='index.html', 1200);
}

function saveCard(){
  const nm = document.getElementById('f-nm').value.trim();
  if(!nm){ toast('이름을 입력해주세요'); return; }
  const co = document.getElementById('f-co').value.trim();
  const cards = DB.getCards();

  const dup = cards.find(c=>c.nm===nm&&c.co===co);
  if(dup){
    if(!confirm(`이미 등록된 명함입니다.\n\n${nm} / ${co}\n\n업데이트할까요?`)) return;
    dup.tl   = document.getElementById('f-tl').value.trim();
    dup.mob  = document.getElementById('f-mob').value.trim();
    dup.ph   = document.getElementById('f-ph').value.trim();
    dup.em   = document.getElementById('f-em').value.trim();
    dup.addr = document.getElementById('f-addr').value.trim();
    if(captured) dup.img = captured;
    try { DB.setCards(cards); } catch(e) { dup.img = null; DB.setCards(cards); }
    toast('업데이트됐습니다 ✓');
    location.href='index.html';
    return;
  }

  cards.unshift({
    id:'c'+Date.now(), nm, co,
    tl:document.getElementById('f-tl').value.trim(),
    mob:document.getElementById('f-mob').value.trim(),
    ph:document.getElementById('f-ph').value.trim(),
    em:document.getElementById('f-em').value.trim(),
    addr:document.getElementById('f-addr').value.trim(),
    tag:'고객', cl:COLORS[Math.floor(Math.random()*COLORS.length)], fav:false,
    img:captured||null
  });
  try { DB.setCards(cards); } catch(e) { cards[0].img = null; DB.setCards(cards); }
  toast('명함이 저장됐습니다 ✓');
  location.href='index.html';
}
</script>
</body>
</html>
