name: 배포 로그
run-name: "${{ github.event.head_commit.message }}"

on:
  push:
    branches: [main]

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: 커밋 정보 출력
        run: |
          echo "커밋: ${{ github.event.head_commit.message }}"
          echo "시각: ${{ github.event.head_commit.timestamp }}"
          echo "작성: ${{ github.event.head_commit.author.name }}"
