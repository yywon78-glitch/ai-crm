<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>거래처</title>
<link rel="stylesheet" href="shared.css?v=187">
</head>
<body>
<!-- ① 거래처 목록 -->
<div class="page">
  <header class="hdr">
    <span class="hdr-t">거래처</span>
    <button class="hdr-btn" onclick="openAddModal()">+ 등록</button>
  </header>
  <div class="srch-wrap">
    <input class="srch" id="srch" placeholder="🔍  거래처명 검색" oninput="render()">
  </div>
  <div style="display:flex;align-items:center;background:var(--card);border-bottom:1px solid var(--bdr);padding:0 12px;gap:16px;">
    <div onclick="setOwner('all')" style="display:flex;align-items:center;gap:5px;cursor:pointer;padding:8px 0;flex-shrink:0;">
      <span id="radio-all" style="font-size:15px;color:var(--blue);">●</span>
      <span id="radio-all-t" style="font-size:12px;font-weight:700;color:var(--t1);">전체</span>
    </div>
    <div onclick="setOwner('mine')" style="display:flex;align-items:center;gap:5px;cursor:pointer;padding:8px 0;flex-shrink:0;">
      <span id="radio-mine" style="font-size:15px;color:var(--t3);">○</span>
      <span id="radio-mine-t" style="font-size:12px;font-weight:700;color:var(--t3);">내것만</span>
    </div>
    <div id="stat-pills" style="flex:1;font-size:12px;color:var(--t3);"></div>
  </div>
  <div class="body"><div class="bp" id="list"></div></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- ② 거래처 상세 오버레이 -->
<div class="overlay" id="overlay-co" style="z-index:100;"></div>

<!-- ③ 방문기록 추가 모달 -->
<div class="moverlay" id="modal-visit" style="z-index:200;" onclick="if(event.target===this)closeVisitModal()">
  <div class="msheet">
    <div class="m-handle"></div>
    <div class="m-title">방문 기록 추가</div>
    <div class="m-body">
      <div style="font-size:13px;font-weight:600;color:var(--blue);padding:2px 0;" id="v-co-lbl"></div>
      <div>
        <div class="flb">방문 유형</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;" id="type-grid"></div>
      </div>
      <div><div class="flb">방문 날짜</div><input class="finp" type="date" id="v-dt"></div>
      <div><div class="flb">메모</div><textarea class="finp" id="v-memo" rows="3" style="resize:none;" placeholder="미팅 내용을 입력하세요..."></textarea></div>
      <div><div class="flb">다음 일정</div><input class="finp" type="date" id="v-next"></div>
      <button class="m-btn" onclick="saveVisit()">저장</button>
    </div>
  </div>
</div>

<!-- ④ 거래처 추가 모달 -->
<div class="moverlay" id="modal-add-co" style="z-index:200;" onclick="if(event.target===this)closeAddModal()">
  <div class="msheet">
    <div class="m-handle"></div>
    <div class="m-title">거래처 등록</div>
    <div class="m-body">
      <div><div class="flb">회사명 *</div><input class="finp" id="co-nm" placeholder="회사명"></div>
      <div><div class="flb">주소</div><input class="finp" id="co-addr" placeholder="주소"></div>
      <div><div class="flb">업종</div><input class="finp" id="co-ind" placeholder="업종 (예: IT/소프트웨어)"></div>
      <button class="m-btn" onclick="saveCo()">등록</button>
    </div>
  </div>
</div>

<script src="data.js?v=187"></script>
<script src="nav.js?v=187"></script>
<script>
let ownerFilter = 'all';
const stLbl = {active:'활성',potential:'잠재',dormant:'휴면'};
const stCls  = {active:'b-gn',potential:'b-am',dormant:'b-rd'};

function setOwner(f) {
  ownerFilter = f;
  document.getElementById('radio-all').textContent  = f==='all'  ? '●' : '○';
  document.getElementById('radio-all').style.color  = f==='all'  ? 'var(--blue)' : 'var(--t3)';
  document.getElementById('radio-all-t').style.color= f==='all'  ? 'var(--t1)' : 'var(--t3)';
  document.getElementById('radio-mine').textContent = f==='mine' ? '●' : '○';
  document.getElementById('radio-mine').style.color = f==='mine' ? 'var(--blue)' : 'var(--t3)';
  document.getElementById('radio-mine-t').style.color=f==='mine' ? 'var(--t1)' : 'var(--t3)';
  render();
}

function render() {
  const q = document.getElementById('srch').value;

  /* 모든 카드(개인+공유)의 회사명으로 거래처 자동 파생 */
  const personalCards = DB.getCards();
  /* 개인카드의 nm+mob 셋 — 공유카드 중복 제거용 */
  const personalKey = new Set(personalCards.map(c=>`${c.nm}|${c.mob||c.ph||''}`));
  const allCards = [
    ...personalCards,
    ...DB.getDriveShared().filter(sc=>{
      if(personalCards.find(c=>c.id===sc.id)) return false; /* 동일 ID */
      return !personalKey.has(`${sc.nm}|${sc.mob||sc.ph||''}`); /* 동일 인물 */
    })
  ];
  const registered = DB.getCos(); /* 수동 등록 거래처 (추가 정보 보유) */
  const regMap = Object.fromEntries(registered.map(c=>[c.nm, c]));

  /* 전체 coMap */
  const coMap = {};
  allCards.forEach(card=>{
    if(!card.co) return;
    if(!coMap[card.co]){
      coMap[card.co] = regMap[card.co]
        ? {...regMap[card.co], cnt:0, mineCnt:0}
        : {id:'_sc_'+card.co, nm:card.co, addr:card.addr||'', ind:'', st:'active', cnt:0, mineCnt:0, last:'-'};
    }
    coMap[card.co].cnt++;
  });
  /* 내것 카운트 */
  personalCards.forEach(card=>{
    if(card.co && coMap[card.co]) coMap[card.co].mineCnt++;
  });
  /* 카드 없이 수동 등록된 거래처도 포함 */
  registered.forEach(c=>{ if(!coMap[c.nm]) coMap[c.nm]={...c, cnt:0, mineCnt:0}; });

  const allList  = Object.values(coMap).sort((a,b)=>a.nm.localeCompare(b.nm,'ko'));
  const mineList = allList.filter(c=>c.mineCnt>0);

  /* 건수 pill */
  document.getElementById('stat-pills').innerHTML =
    `전체 <b>${allList.length}</b>&nbsp;&nbsp;내것 <b>${mineList.length}</b>`;

  let list = ownerFilter==='mine' ? mineList : allList;
  if(q) list=list.filter(c=>c.nm.includes(q)||(c.addr||'').includes(q));

  const el = document.getElementById('list');
  if(!list.length){ el.innerHTML=`<div class="empty"><div class="empty-ic">🏢</div><div class="empty-t">거래처가 없습니다</div></div>`; return; }
  el.innerHTML=list.map(c=>`
    <div class="li" onclick="openCoOverlay('${c.id}')">
      <div class="av" style="background:var(--blue-lt);color:var(--blue);font-size:22px;">🏢</div>
      <div class="li-info">
        <div class="li-name">${c.nm}</div>
        <div class="li-sub">${c.ind||''} · 명함 ${c.cnt}장 · ${c.last}</div>
      </div>
      <div class="li-r"><span class="bx ${stCls[c.st]||'b-bl'}">${stLbl[c.st]||c.st}</span><span class="chev">›</span></div>
    </div>`).join('');
}

function openAddModal() { document.getElementById('modal-add-co').classList.add('show'); }
function closeAddModal() { document.getElementById('modal-add-co').classList.remove('show'); }

function saveCo() {
  const nm=document.getElementById('co-nm').value.trim();
  if(!nm){ toast('회사명을 입력해주세요'); return; }
  const cos=DB.getCos();
  cos.unshift({id:'co'+Date.now(),nm,addr:document.getElementById('co-addr').value.trim(),ind:document.getElementById('co-ind').value.trim(),st:'active',cnt:0,last:'-'});
  DB.setCos(cos);
  ['co-nm','co-addr','co-ind'].forEach(id=>document.getElementById(id).value='');
  closeAddModal();
  render();
  toast('거래처가 등록됐습니다 ✓');
}

renderTabBar('cos');
render();
window.addEventListener('pageshow', e => { if(e.persisted){ closeAllOverlays(); render(); } });
document.addEventListener('visibilitychange', () => { if(!document.hidden){ closeAllOverlays(); render(); } });
</script>
</body>
</html>
