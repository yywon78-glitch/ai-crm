<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>지도</title>
<link rel="stylesheet" href="shared.css">
<style>
.loc-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bdr);}
.loc-addr{flex:1;font-size:13px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.loc-btn{padding:8px 14px;border-radius:10px;background:var(--blue);color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;touch-action:manipulation;}
.loc-btn.s{background:var(--bg);color:var(--t1);border:1.5px solid var(--bdr);}
.co-row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1.5px solid var(--bdr);border-radius:14px;margin-bottom:9px;}
.co-av{width:44px;height:44px;border-radius:12px;background:var(--blue-lt);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.co-info{flex:1;min-width:0;}
.co-nm{font-size:15px;font-weight:700;margin-bottom:2px;}
.co-addr{font-size:12px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.map-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:10px;background:#fee500;border:none;cursor:pointer;flex-shrink:0;touch-action:manipulation;}
.map-btn span{font-size:18px;line-height:1;}
.map-btn small{font-size:10px;font-weight:700;color:#3c1e1e;}
.empty-map{padding:48px 20px;text-align:center;}
.empty-map .ic{font-size:48px;margin-bottom:12px;}
.empty-map p{font-size:14px;color:var(--t2);}
.sec-info{padding:8px 14px;font-size:12px;color:var(--t3);}
</style>
</head>
<body>
<div class="page">
  <header class="hdr">
    <span class="hdr-t">거래처 지도</span>
  </header>

  <!-- 현재 위치 바 -->
  <div class="loc-bar">
    <span class="loc-addr" id="loc-txt">위치 정보 없음</span>
    <button class="loc-btn s" id="loc-btn" onclick="getLocation()">📍 내 위치</button>
    <button class="loc-btn" onclick="openKakaoNear()" id="near-btn" style="display:none;">주변 검색</button>
  </div>

  <div class="body">
    <div class="sec-info" id="sec-info">저장된 거래처 — 🟡 탭하면 카카오맵으로 이동</div>
    <div id="co-list"></div>
  </div>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<script src="data.js"></script>
<script src="nav.js"></script>
<script>
let _lat = null, _lng = null;

function render() {
  const cos = DB.getCos();
  const el = document.getElementById('co-list');
  if(!cos.length){
    el.innerHTML = `<div class="empty-map"><div class="ic">🗺️</div><p>저장된 거래처가 없습니다.<br>거래처를 등록하면 여기에 표시됩니다.</p></div>`;
    return;
  }
  const stLbl={active:'활성',potential:'잠재',dormant:'휴면'};
  const stCls ={active:'b-gn',potential:'b-am',dormant:'b-rd'};
  el.innerHTML = cos.map(c=>`
    <div class="co-row">
      <div class="co-av">🏢</div>
      <div class="co-info" onclick="openCoDetail('${c.id}')" style="cursor:pointer;">
        <div class="co-nm">${c.nm} <span class="bx ${stCls[c.st]||'b-bl'}" style="font-size:10px;">${stLbl[c.st]||c.st}</span></div>
        <div class="co-addr">${c.addr||'주소 없음'}</div>
      </div>
      ${c.addr
        ? `<button class="map-btn" onclick="openKakao('${encodeURIComponent(c.addr)}','${c.nm.replace(/'/g,'').replace(/"/g,'')}')"><span>🟡</span><small>카카오맵</small></button>`
        : `<button class="map-btn" style="background:var(--bg);opacity:.4;" disabled><span>🗺️</span><small>주소없음</small></button>`}
    </div>`).join('');
}

function openKakao(addr, nm) {
  const url = 'https://map.kakao.com/?q=' + addr;
  window.open(url, '_blank');
}

function openKakaoNear() {
  if(_lat && _lng){
    const url = `https://map.kakao.com/?map_type=TYPE_MAP&target=&q=거래처&center=${_lng},${_lat}`;
    window.open(url, '_blank');
  } else {
    window.open('https://map.kakao.com/', '_blank');
  }
}

function openCoDetail(id) {
  location.href = 'co.html?id=' + id;
}

function getLocation() {
  const btn = document.getElementById('loc-btn');
  btn.textContent = '위치 찾는 중...';
  btn.disabled = true;
  if(!navigator.geolocation){
    document.getElementById('loc-txt').textContent = '위치 기능을 지원하지 않습니다';
    btn.textContent = '📍 내 위치'; btn.disabled = false;
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      _lat = pos.coords.latitude;
      _lng = pos.coords.longitude;
      document.getElementById('loc-txt').textContent = `현재 위치 확인됨 (${_lat.toFixed(4)}, ${_lng.toFixed(4)})`;
      btn.textContent = '📍 새로고침'; btn.disabled = false;
      document.getElementById('near-btn').style.display = '';
    },
    err => {
      document.getElementById('loc-txt').textContent = '위치 권한이 필요합니다';
      btn.textContent = '📍 내 위치'; btn.disabled = false;
    },
    {enableHighAccuracy:true, timeout:8000}
  );
}

renderTabBar('map');
render();
</script>
</body>
</html>
