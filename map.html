<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>거래처 지도</title>
<link rel="stylesheet" href="shared.css?v=193">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body{height:100%;margin:0;}
.page{height:100%;display:flex;flex-direction:column;}
#map-wrap{flex:1;position:relative;overflow:hidden;}
#map{width:100%;height:100%;}

/* 우측 FAB */
.fab-col{position:absolute;right:10px;bottom:14px;z-index:900;display:flex;flex-direction:column;gap:8px;}
.fab{width:44px;height:44px;border-radius:50%;border:none;
     box-shadow:0 2px 8px rgba(0,0,0,.22);cursor:pointer;background:#fff;
     display:flex;flex-direction:column;align-items:center;justify-content:center;
     font-size:17px;touch-action:manipulation;color:#111;}
.fab.blue{background:#2563eb;color:#fff;}
.fab.red {background:#dc2626;color:#fff;}
.fab small{font-size:9px;font-weight:700;display:block;line-height:1.1;margin-top:1px;}

/* 상태 메시지 */
.map-msg{position:absolute;top:10px;left:50%;transform:translateX(-50%);
         z-index:900;background:rgba(0,0,0,.72);color:#fff;font-size:12px;
         padding:5px 16px;border-radius:20px;white-space:normal;text-align:center;
         pointer-events:none;display:none;max-width:88vw;line-height:1.5;}
.map-msg.on{display:block;}

/* Leaflet 줌 위치 */
.leaflet-top.leaflet-left{top:8px;left:8px;}
</style>
</head>
<body>
<div class="page">
  <header class="hdr" style="flex-shrink:0;">
    <span class="hdr-t">거래처 지도</span>
  </header>

  <div id="map-wrap">
    <div id="map"></div>
    <div class="map-msg" id="map-msg"></div>

    <div class="fab-col">
      <button class="fab blue" onclick="locateMe()">📍<small>내위치</small></button>
      <button class="fab" id="fab-layer" onclick="toggleLayer()">
        <span id="layer-ic">🛰️</span><small id="layer-lbl">위성</small>
      </button>
      <button class="fab" id="fab-dist" onclick="toggleMeasure()">
        📏<small>거리재기</small>
      </button>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" style="flex-shrink:0;"></nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js?v=193"></script>
<script src="nav.js?v=193"></script>
<script>
/* ── 타일 레이어 ── */
const T = {
  street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap', maxZoom:19
  }),
  sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
    attribution:'© Esri World Imagery', maxZoom:19
  })
};

const map = L.map('map',{zoomControl:true}).setView([37.5665,126.9780],11);
T.street.addTo(map);
let _curTile = 'street';

function toggleLayer(){
  const next = _curTile==='street' ? 'sat' : 'street';
  map.removeLayer(T[_curTile]);
  T[next].addTo(map);
  _curTile = next;
  document.getElementById('layer-ic').textContent = next==='sat' ? '🗺️' : '🛰️';
  document.getElementById('layer-lbl').textContent = next==='sat' ? '일반' : '위성';
}

/* ── 상태 메시지 ── */
let _mt;
function msg(txt,dur=3000){
  const el=document.getElementById('map-msg');
  el.textContent=txt; el.classList.add('on');
  clearTimeout(_mt);
  if(dur>0) _mt=setTimeout(()=>el.classList.remove('on'),dur);
}
function msgHide(){ document.getElementById('map-msg').classList.remove('on'); }

/* ── 내 위치 ── */
let _myMk=null;
function locateMe(){
  msg('위치 확인 중...',0);
  if(!navigator.geolocation){ msg('위치 기능을 지원하지 않습니다'); return; }
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const {latitude:lat,longitude:lng}=pos.coords;
      if(_myMk) map.removeLayer(_myMk);
      _myMk=L.circleMarker([lat,lng],{radius:9,fillColor:'#2563eb',color:'#fff',weight:2.5,fillOpacity:1})
        .addTo(map).bindTooltip('📍 현재 위치');
      map.setView([lat,lng],14);
      msgHide();
    },
    err=>{
      if(err.code===1){
        const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
        msg(ios
          ? '⚠️ 설정 → 개인정보보호 → 위치서비스 → Safari → "앱 사용 중" 선택'
          : '⚠️ 주소창 🔒 아이콘 → 위치 → 허용 선택',
          7000);
      } else { msg('위치를 가져올 수 없습니다'); }
    },
    {enableHighAccuracy:true,timeout:10000}
  );
}

/* ── 거리재기 ── */
let _measuring=false, _pts=[], _line=null, _lbls=[];
function toggleMeasure(){
  _measuring=!_measuring;
  const btn=document.getElementById('fab-dist');
  btn.classList.toggle('red',_measuring);
  if(!_measuring){
    if(_line) map.removeLayer(_line);
    _lbls.forEach(l=>map.removeLayer(l));
    _pts=[]; _line=null; _lbls=[];
    msgHide();
  } else { msg('지도를 탭해서 거리를 재세요  ·  다시 누르면 종료',4000); }
}
map.on('click',e=>{
  if(!_measuring) return;
  _pts.push(e.latlng);
  if(_line) map.removeLayer(_line);
  _line=L.polyline(_pts,{color:'#dc2626',weight:3,opacity:.9}).addTo(map);
  if(_pts.length>1){
    let d=0;
    for(let i=1;i<_pts.length;i++) d+=_pts[i-1].distanceTo(_pts[i]);
    const lbl=d>=1000?`${(d/1000).toFixed(2)}km`:`${Math.round(d)}m`;
    const ov=L.marker(_pts[_pts.length-1],{
      icon:L.divIcon({html:`<div style="background:#dc2626;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap;">${lbl}</div>`,className:'',iconAnchor:[0,20]})
    }).addTo(map);
    _lbls.push(ov);
    msg(`📏 총 ${lbl}`,0);
  }
});

/* ── 지오코딩 캐시 ── */
const GK='crm_geo4';
function gCache(){try{return JSON.parse(localStorage.getItem(GK)||'{}')}catch(e){return{}}}
function gSave(a,v){try{const c=gCache();c[a]=v;localStorage.setItem(GK,JSON.stringify(c))}catch(e){}}

/* 주소 정제 — 층/호/건물명 제거 */
function _cleanAddr(addr){
  return addr
    .replace(/^\s*\(우\)?\s*\d{5}\s*/,'')
    .replace(/^\s*\d{5}\s+/,'')
    .replace(/\s+\d+층.*$/,'')
    .replace(/\s+\d+-\d+호.*$/,'')
    .replace(/\([^)]{2,}\)/g,'')
    .replace(/,.*$/,'')
    .replace(/\s+/g,' ').trim();
}

/* ── 카카오 지오코딩 (주소검색 → 키워드검색) → Nominatim 폴백 ── */
async function geocode(addr){
  if(!addr) return null;
  const raw = addr.replace(/\s+/g,' ').trim();
  if(!raw) return null;
  const c=gCache(); if(c[raw]) return c[raw];

  const kakaoKey = DB.getKakaoKey();

  /* 1) 카카오 주소 검색 */
  if(kakaoKey){
    const cleaned = _cleanAddr(raw);
    try{
      const r = await fetch(`https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(cleaned)}&size=1`,
        {headers:{Authorization:'KakaoAK '+kakaoKey}});
      const d = await r.json();
      const doc = d.documents?.[0];
      if(doc && (doc.x || doc.address?.x)){
        const x = doc.x || doc.address?.x, y = doc.y || doc.address?.y;
        const v = {lat:+y, lng:+x};
        gSave(raw, v); return v;
      }
    }catch(e){}

    /* 2) 카카오 키워드 검색 (주소 검색 실패 시) */
    try{
      const r = await fetch(`https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(cleaned)}&size=1`,
        {headers:{Authorization:'KakaoAK '+kakaoKey}});
      const d = await r.json();
      const doc = d.documents?.[0];
      if(doc){
        const v = {lat:+doc.y, lng:+doc.x};
        gSave(raw, v); return v;
      }
    }catch(e){}
  }

  /* 3) Nominatim 폴백 */
  try{
    const cleaned = _cleanAddr(raw);
    const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cleaned)}&format=json&limit=1&countrycodes=kr`,
      {headers:{'Accept-Language':'ko','User-Agent':'CRM-Map/1.0'}});
    const d=await r.json();
    if(d.length){ const v={lat:+d[0].lat,lng:+d[0].lon}; gSave(raw,v); return v; }
  }catch(e){}
  return null;
}

/* 두 좌표 간 거리(km) */
function _dist(lat1,lng1,lat2,lng2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ── 마커 아이콘 ── */
const SC={active:'#2563eb',potential:'#d97706',dormant:'#9ca3af'};
function mkIcon(color){
  return L.divIcon({
    html:`<div style="width:34px;height:34px;border-radius:50%;background:${color};border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:15px;">🏢</div>`,
    className:'',iconSize:[34,34],iconAnchor:[17,34],popupAnchor:[0,-36]
  });
}

/* 같은 좌표 마커 분산 */
const _posCount = {};
function spreadPos(lat, lng){
  const k = `${lat.toFixed(4)},${lng.toFixed(4)}`;
  const n = (_posCount[k] = (_posCount[k]||0) + 1);
  if(n === 1) return [lat, lng];
  /* n번째부터 원형 배치 (반경 약 30m) */
  const angle = ((n - 2) * 60) * Math.PI / 180;
  return [lat + 0.00028 * Math.cos(angle), lng + 0.00028 * Math.sin(angle)];
}

/* ── 거래처 로드 — 현재 위치 기준 반경 내만 표시 ── */
const RADIUS_KM = 20; /* 반경 20km */
const MAX_COS   = 30; /* 최대 표시 수 */

async function loadCos(centerLat, centerLng){
  const personal = DB.getCards();
  const personalIds = new Set(personal.map(c=>c.id));
  const sharedCards = DB.getDriveShared().filter(c=>!personalIds.has(c.id));
  const allCards = [...personal, ...sharedCards];

  const coMap = {};
  allCards.forEach(c=>{
    if(c.co && c.addr && !coMap[c.co])
      coMap[c.co] = {nm:c.co, addr:c.addr, id:'_sc_'+c.co, st:'active'};
  });
  DB.getCos().filter(c=>c.addr).forEach(c=>{ coMap[c.nm]={...c}; });

  const cos = Object.values(coMap);
  if(!cos.length){msg('주소가 있는 거래처가 없습니다');return;}

  const label = centerLat ? `현위치 ${RADIUS_KM}km 내 검색 중...` : `거래처 검색 중...`;
  msg(label, 0);

  const bounds=[], _markers=[];
  let found=0;
  for(let i=0;i<cos.length && found<MAX_COS;i++){
    const co=cos[i];
    const pos=await geocode(co.addr);
    if(!pos) continue;

    /* 위치 있을 때만 거리 필터 */
    if(centerLat){
      const km = _dist(centerLat, centerLng, pos.lat, pos.lng);
      if(km > RADIUS_KM) continue;
    }

    found++;
    const [slat,slng] = spreadPos(pos.lat, pos.lng);
    const m=L.marker([slat,slng],{icon:mkIcon(SC[co.st]||'#2563eb')}).addTo(map);
    m.bindTooltip(co.nm,{permanent:true,direction:'top',offset:[0,-36],opacity:1});
    m.bindPopup(`
      <div style="font-size:14px;font-weight:700;margin-bottom:3px;">${co.nm}</div>
      <div style="font-size:11px;color:#666;margin-bottom:10px;">${co.addr}</div>
      <button onclick="location.href='co.html?id=${encodeURIComponent(co.id)}'"
        style="display:block;width:100%;padding:8px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;">
        거래처 상세 →
      </button>`);
    bounds.push([slat,slng]);
    msg(`검색 중... ${found}곳 찾음`, 0);
  }

  msgHide();
  if(found===0){ msg(centerLat ? `${RADIUS_KM}km 내 거래처가 없습니다` : '주소를 찾을 수 없습니다'); return; }
  msg(`주변 거래처 ${found}곳`, 2500);
  if(bounds.length>1) map.fitBounds(bounds,{padding:[50,50]});
  else if(bounds.length===1) map.setView(bounds[0],15);
}

renderTabBar('map');

(async function(){
  const focusAddr = qp('addr');
  const focusNm   = qp('nm');

  /* 특정 거래처로 진입 — 마커 즉시 표시 후 주변 거래처 백그라운드 로드 */
  if(focusAddr){
    msg('위치 검색 중...',0);
    const pos = await geocode(focusAddr);
    if(pos){
      map.setView([pos.lat,pos.lng],15);
      const focusMk = L.marker([pos.lat,pos.lng],{
        icon: L.divIcon({
          html:`<div style="width:44px;height:44px;border-radius:50%;background:#dc2626;border:3px solid #fff;box-shadow:0 2px 12px rgba(220,38,38,.5);display:flex;align-items:center;justify-content:center;font-size:20px;">🏢</div>`,
          className:'',iconSize:[44,44],iconAnchor:[22,44],popupAnchor:[0,-46]
        })
      }).addTo(map);
      focusMk.bindTooltip(`<b>${focusNm||''}</b>`,{permanent:true,direction:'top',offset:[0,-46],opacity:1});
      msgHide();
      /* 주변 거래처는 백그라운드로 — UI 블로킹 없음 */
      setTimeout(()=>loadCos(pos.lat, pos.lng), 300);
    } else {
      msgHide();
      msg(`주소를 찾을 수 없습니다: ${focusNm||focusAddr}`, 4000);
    }
    return;
  }

  /* 현재 위치 먼저 가져온 후 주변 거래처 표시 */
  if(navigator.geolocation){
    msg('현재 위치 확인 중...',0);
    navigator.geolocation.getCurrentPosition(
      pos=>{
        const {latitude:lat,longitude:lng}=pos.coords;
        if(_myMk) map.removeLayer(_myMk);
        _myMk=L.circleMarker([lat,lng],{radius:9,fillColor:'#2563eb',color:'#fff',weight:2.5,fillOpacity:1})
          .addTo(map).bindTooltip('📍 현재 위치');
        map.setView([lat,lng],13);
        msgHide();
        loadCos(lat, lng);
      },
      ()=>{ msgHide(); loadCos(); },
      {enableHighAccuracy:true,timeout:8000}
    );
  } else {
    loadCos();
  }
})();
</script>
</body>
</html>
