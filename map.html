<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>지도</title>
<link rel="stylesheet" href="shared.css">
<style>
.map-wrap{flex:1;position:relative;background:#e8f0e8;overflow:hidden;}
.road{position:absolute;background:#fff;}
.road.h{left:0;right:0;height:10px;}
.road.v{top:0;bottom:0;width:10px;}
.road.main{background:#f5f5dc;}
.road.main.h{height:18px;}
.road.main.v{width:18px;}
.pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.pin-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.pin-lbl{background:rgba(0,0,0,.7);color:#fff;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;white-space:nowrap;}
.pin-bl .pin-dot{background:var(--blue);}
.pin-gn .pin-dot{background:var(--grn);}
.pin-am .pin-dot{background:var(--amb);}
.me{position:absolute;transform:translate(-50%,-50%);}
.me-dot{width:14px;height:14px;background:var(--blue);border:2.5px solid #fff;border-radius:50%;box-shadow:0 0 0 6px rgba(37,99,235,.2);}
.map-pop{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:14px 16px;min-width:220px;box-shadow:0 4px 20px rgba(0,0,0,.18);display:none;}
.map-pop.show{display:block;}
.map-pop-nm{font-size:15px;font-weight:700;margin-bottom:4px;}
.map-pop-ad{font-size:12px;color:var(--t2);margin-bottom:10px;}
.map-pop-row{display:flex;gap:8px;}
.mp-btn{flex:1;padding:9px;border-radius:9px;border:none;font-size:13px;font-weight:700;cursor:pointer;}
.mp-btn.p{background:var(--blue);color:#fff;}
.mp-btn.s{background:var(--bg);color:var(--t2);}
.map-legend{background:var(--card);border-top:1px solid var(--bdr);padding:8px 16px;display:flex;gap:16px;flex-shrink:0;}
.map-legend span{font-size:12px;color:var(--t2);display:flex;align-items:center;gap:5px;}
</style>
</head>
<body>
<div class="page">
  <header class="hdr"><span class="hdr-t">지도</span></header>
  <div class="map-wrap" id="map">
    <!-- 도로 -->
    <div class="road main h" style="top:33%"></div>
    <div class="road main h" style="top:60%"></div>
    <div class="road main v" style="left:38%"></div>
    <div class="road main v" style="left:68%"></div>
    <div class="road h" style="top:18%"></div>
    <div class="road h" style="top:46%"></div>
    <div class="road h" style="top:74%"></div>
    <div class="road v" style="left:20%"></div>
    <div class="road v" style="left:53%"></div>
    <div class="road v" style="left:84%"></div>
    <!-- 핀 -->
    <div class="pin pin-bl" style="left:37%;top:32%" onclick="showPop('삼성전자(주)','서울 서초구 서초동','co1')"><div class="pin-dot">🏢</div><div class="pin-lbl">삼성전자</div></div>
    <div class="pin pin-gn" style="left:66%;top:24%" onclick="showPop('LG화학(주)','서울 영등포구 여의도동','co2')"><div class="pin-dot">🏢</div><div class="pin-lbl">LG화학</div></div>
    <div class="pin pin-am" style="left:54%;top:55%" onclick="showPop('현대모비스(주)','경기 성남시 분당구','co3')"><div class="pin-dot">🏢</div><div class="pin-lbl">현대모비스</div></div>
    <div class="pin pin-bl" style="left:24%;top:58%" onclick="showPop('SK텔레콤(주)','서울 중구 을지로','co4')"><div class="pin-dot">🏢</div><div class="pin-lbl">SK텔레콤</div></div>
    <div class="pin pin-am" style="left:71%;top:66%" onclick="showPop('KT(주)','서울 종로구 광화문','co5')"><div class="pin-dot">🏢</div><div class="pin-lbl">KT</div></div>
    <div class="pin pin-gn" style="left:42%;top:75%" onclick="showPop('네이버(주)','경기 성남시 분당구','co6')"><div class="pin-dot">🏢</div><div class="pin-lbl">네이버</div></div>
    <!-- 내 위치 -->
    <div class="me" style="left:46%;top:44%"><div class="me-dot"></div></div>
    <!-- 팝업 -->
    <div class="map-pop" id="map-pop">
      <div class="map-pop-nm" id="pop-nm"></div>
      <div class="map-pop-ad" id="pop-ad"></div>
      <div class="map-pop-row">
        <button class="mp-btn p" id="pop-go">상세보기</button>
        <button class="mp-btn s" onclick="document.getElementById('map-pop').classList.remove('show')">닫기</button>
      </div>
    </div>
  </div>
  <div class="map-legend">
    <span><span style="color:var(--blue);">●</span>활성</span>
    <span><span style="color:var(--amb);">●</span>잠재</span>
    <span><span style="color:var(--t3);">●</span>휴면</span>
    <span style="margin-left:auto;color:var(--blue);font-size:11px;">🗺 Kakao Map 연동 예정</span>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<script src="data.js"></script>
<script src="nav.js"></script>
<script>
function showPop(nm, addr, coId){
  document.getElementById('pop-nm').textContent=nm;
  document.getElementById('pop-ad').textContent=addr;
  document.getElementById('pop-go').onclick=()=>location.href=`co.html?id=${coId}`;
  document.getElementById('map-pop').classList.add('show');
}
renderTabBar('map');
</script>
</body>
</html>
