<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>거래처 지도</title>
<link rel="stylesheet" href="shared.css">
<style>
html,body{height:100%;margin:0;}
.page{height:100%;display:flex;flex-direction:column;}
#map-wrap{flex:1;position:relative;overflow:hidden;}
#map{width:100%;height:100%;}

/* 우측 FAB */
.fab-col{position:absolute;right:10px;bottom:14px;z-index:5;display:flex;flex-direction:column;gap:8px;}
.fab{width:44px;height:44px;border-radius:50%;border:none;
     box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;
     display:flex;flex-direction:column;align-items:center;justify-content:center;
     font-size:18px;touch-action:manipulation;background:#fff;}
.fab.active{background:#2563eb;color:#fff;}
.fab small{font-size:9px;font-weight:700;line-height:1.2;margin-top:1px;color:inherit;}
.fab-me{background:#2563eb;color:#fff;}

/* 상태 토스트 */
.map-msg{position:absolute;top:10px;left:50%;transform:translateX(-50%);
         z-index:10;background:rgba(0,0,0,.72);color:#fff;font-size:12px;
         padding:6px 18px;border-radius:20px;white-space:nowrap;
         pointer-events:none;display:none;max-width:90vw;white-space:normal;text-align:center;}
.map-msg.on{display:block;}

/* 미설정 안내 */
.map-setup{position:absolute;inset:0;z-index:20;background:var(--bg);
           display:flex;flex-direction:column;align-items:center;justify-content:center;
           padding:24px;text-align:center;}
.map-setup h3{font-size:17px;font-weight:700;margin-bottom:8px;}
.map-setup p{font-size:13px;color:var(--t2);line-height:1.7;margin-bottom:20px;}
</style>
</head>
<body>
<div class="page">
  <header class="hdr" style="flex-shrink:0;">
    <span class="hdr-t">거래처 지도</span>
  </header>

  <div id="map-wrap">
    <div id="map"></div>
    <div class="map-msg" id="map-msg"></div>

    <!-- API 키 미설정 안내 -->
    <div class="map-setup" id="map-setup" style="display:none;">
      <div style="font-size:48px;margin-bottom:12px;">🗺️</div>
      <h3>카카오맵 API 키 필요</h3>
      <p>설정에서 카카오맵 JavaScript API 키를<br>입력하면 지도가 활성화됩니다.<br><br>
      <b>developers.kakao.com</b>에서<br>무료로 발급받을 수 있습니다.</p>
      <button onclick="location.href='settings.html'"
        style="padding:12px 28px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;">
        ⚙️ 설정으로 이동
      </button>
    </div>

    <!-- 우측 FAB -->
    <div class="fab-col" id="fab-col" style="display:none;">
      <button class="fab fab-me" onclick="locateMe()">📍<small>내위치</small></button>
      <button class="fab" id="fab-dist" onclick="toggleMeasure()">📏<small>거리재기</small></button>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" style="flex-shrink:0;"></nav>
</div>

<script src="data.js"></script>
<script src="nav.js"></script>
<script>
renderTabBar('map');

const kakaoKey = DB.getKakaoKey();
if(!kakaoKey){
  document.getElementById('map-setup').style.display = 'flex';
} else {
  loadKakaoMap(kakaoKey);
}

function loadKakaoMap(key){
  const s = document.createElement('script');
  s.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${key}&autoload=false&libraries=services,geometry`;
  s.onerror = () => {
    document.getElementById('map-setup').innerHTML =
      '<div style="padding:32px;text-align:center;"><p style="color:#dc2626;font-weight:700;">API 키 오류<br>키를 확인해주세요</p>' +
      '<button onclick="location.href=\'settings.html\'" style="margin-top:12px;padding:10px 20px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;">설정으로 이동</button></div>';
    document.getElementById('map-setup').style.display = 'flex';
  };
  s.onload = () => kakao.maps.load(initMap);
  document.head.appendChild(s);
}

/* ── 상태 메시지 ── */
let _msgTimer;
function msg(txt, dur=3000){
  const el = document.getElementById('map-msg');
  el.textContent = txt; el.classList.add('on');
  clearTimeout(_msgTimer);
  if(dur > 0) _msgTimer = setTimeout(()=>el.classList.remove('on'), dur);
}
function msgHide(){ document.getElementById('map-msg').classList.remove('on'); }

/* ── 지도 초기화 ── */
let _map, _myMarker;
let _measuring = false, _measureLine = null, _measurePts = [], _measureOverlays = [];

function initMap(){
  const container = document.getElementById('map');
  _map = new kakao.maps.Map(container, {
    center: new kakao.maps.LatLng(37.5665, 126.9780),
    level: 6
  });

  /* 컨트롤 */
  _map.addControl(new kakao.maps.MapTypeControl(), kakao.maps.ControlPosition.TOPRIGHT);
  _map.addControl(new kakao.maps.ZoomControl(),    kakao.maps.ControlPosition.RIGHT);

  document.getElementById('fab-col').style.display = 'flex';

  /* 지도 클릭 → 거리재기 */
  kakao.maps.event.addListener(_map, 'click', function(e){
    if(!_measuring) return;
    _measurePts.push(e.latLng);
    drawMeasure();
  });

  loadCos();
}

/* ── 현재 위치 ── */
function locateMe(){
  msg('위치 확인 중...', 0);
  if(!navigator.geolocation){ msg('위치 기능을 지원하지 않습니다'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      const latlng = new kakao.maps.LatLng(lat, lng);
      if(_myMarker) _myMarker.setMap(null);
      _myMarker = new kakao.maps.CustomOverlay({
        position: latlng,
        content: '<div style="width:16px;height:16px;background:#2563eb;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 6px rgba(37,99,235,.2);"></div>',
        zIndex: 10
      });
      _myMarker.setMap(_map);
      _map.setCenter(latlng);
      _map.setLevel(4);
      msgHide();
    },
    err => {
      const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
      if(err.code === 1){
        const guide = isIOS
          ? '⚠️ 설정 → 개인정보보호 → 위치서비스 → Safari → "앱 사용 중" 선택'
          : '⚠️ 주소창 왼쪽 자물쇠 아이콘 → 위치 → 허용 선택';
        msg(guide, 7000);
      } else {
        msg('위치를 가져올 수 없습니다');
      }
    },
    {enableHighAccuracy:true, timeout:10000}
  );
}

/* ── 거리재기 ── */
function toggleMeasure(){
  _measuring = !_measuring;
  document.getElementById('fab-dist').classList.toggle('active', _measuring);
  if(!_measuring){
    if(_measureLine) _measureLine.setMap(null);
    _measureOverlays.forEach(o=>o.setMap(null));
    _measurePts = []; _measureLine = null; _measureOverlays = [];
    msgHide();
  } else {
    msg('지도를 탭하여 거리를 측정하세요', 3000);
  }
}

function drawMeasure(){
  if(_measureLine) _measureLine.setMap(null);
  _measureLine = new kakao.maps.Polyline({
    map: _map,
    path: _measurePts,
    strokeWeight: 3,
    strokeColor: '#dc2626',
    strokeOpacity: 0.9,
    strokeStyle: 'solid'
  });
  if(_measurePts.length > 1){
    const dist = kakao.maps.geometry.spherical.computeLength(_measurePts);
    const label = dist >= 1000 ? `${(dist/1000).toFixed(2)}km` : `${Math.round(dist)}m`;
    msg(`📏 총 ${label}`, 0);
    const ov = new kakao.maps.CustomOverlay({
      position: _measurePts[_measurePts.length-1],
      content: `<div style="background:#dc2626;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;">${label}</div>`,
      yAnchor: 2, zIndex: 5
    });
    ov.setMap(_map);
    _measureOverlays.push(ov);
  }
}

/* ── 거래처 마커 ── */
const ST_COLOR = {active:'#2563eb', potential:'#d97706', dormant:'#9ca3af'};

function loadCos(){
  const cos = DB.getCos().filter(c=>c.addr);
  if(!cos.length) return;
  msg(`거래처 ${cos.length}곳 위치 검색 중...`, 0);
  const geocoder = new kakao.maps.services.Geocoder();
  const bounds = new kakao.maps.LatLngBounds();
  let done = 0;

  cos.forEach(co => {
    geocoder.addressSearch(co.addr, function(result, status){
      done++;
      if(status === kakao.maps.services.Status.OK){
        const latlng = new kakao.maps.LatLng(result[0].y, result[0].x);
        bounds.extend(latlng);
        placeMarker(co, latlng);
      }
      if(done === cos.length){
        msgHide();
        try{ _map.setBounds(bounds, 50); }catch(e){}
      }
    });
  });
}

function placeMarker(co, latlng){
  const color = ST_COLOR[co.st] || '#2563eb';
  const marker = new kakao.maps.Marker({
    position: latlng,
    map: _map,
    title: co.nm
  });

  /* 회사명 라벨 */
  const label = new kakao.maps.CustomOverlay({
    position: latlng,
    content: `<div style="background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;margin-bottom:4px;">${co.nm}</div>`,
    yAnchor: 3.2, zIndex: 3
  });
  label.setMap(_map);

  /* 인포윈도우 */
  const iw = new kakao.maps.InfoWindow({
    content: `<div style="padding:10px 14px;min-width:160px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:3px;">${co.nm}</div>
      <div style="font-size:11px;color:#666;margin-bottom:10px;">${co.addr||''}</div>
      <button onclick="location.href='co.html?id=${co.id}'"
        style="display:block;width:100%;padding:8px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;">
        거래처 상세 →
      </button></div>`,
    removable: true
  });

  kakao.maps.event.addListener(marker, 'click', function(){
    iw.open(_map, marker);
  });
}
</script>
</body>
</html>
